<body>
<main class="course">
  <header>

  </header>
  <div id="outline"></div>
  <section class="chapter">
    <h2>مرجع سریع</h2>
    <div class="fa-title">برای بخش‌های 1 تا 3 (منطق فازی)</div>

</main>
<script src="assets/teacher.js"></script>

// Teacher.html keeps English words and numbers in order inside Persian text.
const fa = Teacher.html;
let n = 0;
document.getElementById('outline').innerHTML = COURSE.map(([title, en, lessons]) => `
  <section class="chapter">
    <h2>${fa(title)}</h2>
    <div class="fa-title" lang="en" dir="ltr">${en}</div>
    <ol start="${n + 1}">
      ${lessons.map(([t, slides, covers, href]) => { n++; return `
        <li>${href ? `<a href="${href}"><strong>${fa(t)}</strong></a><span class="badge ready">آماده</span>` : `<strong>${fa(t)}</strong><span class="badge soon">به‌زودی</span>`}

          <span class="covers">${fa(covers)}</span></li>`; }).join('')}
    </ol>
  </section>`).join('');
</script>
</body>
</html>
