// A straight piece μ(z) = p + q·z on [a, b]: area and moment, exactly.
const piece = (a, b, p, q) => ({
  a, b,
  area: p * (b - a) + q * (b * b - a * a) / 2,
  moment: p * (b * b - a * a) / 2 + q * (b ** 3 - a ** 3) / 3,
});

// ---------------------------------------------------------------- homework 3
// Membership degrees as given on the homework sheet (read from its graphs).
const HW3 = { cold: 0.1, tmed: 0.2, thigh: 0, hlow: 0, hmed: 0.58, hhigh: 0.5 };
const R1 = Math.min(HW3.cold, HW3.hmed);   // 0.1 → speed Low
const R2 = Math.min(HW3.tmed, HW3.hmed);   // 0.2 → speed Medium
const R3 = Math.min(HW3.thigh, HW3.hhigh); // 0   → speed High
// Output sets read from the speed graph (same reading as the given solution).
const sLow = z => (z <= 6 ? 1 : z <= 27 ? (27 - z) / 21 : 0);
const sMed = z => (z < 22 || z > 67 ? 0 : z <= 43 ? (z - 22) / 21 : (67 - z) / 24);
const sHigh = z => (z < 58 ? 0 : z < 75 ? (z - 58) / 17 : 1);
const agg3 = z => Math.max(Math.min(R1, sLow(z)), Math.min(R2, sMed(z)), Math.min(R3, sHigh(z)));
const B1 = 22 + R1 * 21, B2 = 22 + R2 * 21, B3 = 67 - R2 * 24; // 24.1, 26.2, 62.2
const P3 = [
  piece(0, B1, R1, 0),
  piece(B1, B2, -22 / 21, 1 / 21),
  piece(B2, B3, R2, 0),
  piece(B3, 67, 67 / 24, -1 / 24),
];
const A3 = P3.reduce((s, p) => s + p.area, 0);   // 10.405
const M3 = P3.reduce((s, p) => s + p.moment, 0); // 385.86
const Z3 = M3 / A3;                               // 37.08
const BIS3 = B2 + (A3 / 2 - P3[0].area - P3[1].area) / R2; // 38.59
const D3 = (() => { let n = 0, d = 0; for (let z = 0; z <= 100; z += 10) { n += z * agg3(z); d += agg3(z); } return [n, d, n / d]; })();
// With the exact reading μ_cold(29) = 1/15 instead of 0.1:
const Z3exact = (() => {
  const c = 1 / 15, f = z => Math.max(Math.min(c, sLow(z)), Math.min(R2, sMed(z)));
  let n = 0, d = 0; const h = 0.001;
  for (let z = h / 2; z < 100; z += h) { n += z * f(z) * h; d += f(z) * h; }
  return n / d;
})();

];
const A4 = P4.reduce((s, p) => s + p.area, 0);         // 421.60
const M4 = P4.reduce((s, p) => s + p.area * p.c, 0);   // 1 463 814
const C4 = M4 / A4;                                     // 3472.06
const BIS4 = Y1 + (A4 / 2 - P4[0].area) / AL;           // 3471.15
const MOM4 = (Y1 + Y2) / 2;                             // 3442.31
