// Lesson 16 — practice for part 4: homework 3 (Mamdani incubator controller) and homework 4
// (one rule, five defuzzification methods), solved step by step on the board.
// Explanations are Persian; numbers, math and technical terms stay in English.

const fmt = (n, d = 2) => String(+n.toFixed(d));
const all = list => Promise.all(list);
const LTR = s => s; // the player now keeps English / number runs in order inside Persian text by itself

// A straight piece μ(z) = p + q·z on [a, b]: area and moment, exactly.
const piece = (a, b, p, q) => ({
  a, b,
  area: p * (b - a) + q * (b * b - a * a) / 2,
  moment: p * (b * b - a * a) / 2 + q * (b ** 3 - a ** 3) / 3,
});

// ---------------------------------------------------------------- homework 3
// Membership degrees as given on the homework sheet (read from its graphs).
const HW3 = { cold: 0.1, tmed: 0.2, thigh: 0, hlow: 0, hmed: 0.58, hhigh: 0.5 };
const R1 = Math.min(HW3.cold, HW3.hmed);   // 0.1 → speed Low
const R2 = Math.min(HW3.tmed, HW3.hmed);   // 0.2 → speed Medium
const R3 = Math.min(HW3.thigh, HW3.hhigh); // 0   → speed High
// Output sets read from the speed graph (same reading as the given solution).
const sLow = z => (z <= 6 ? 1 : z <= 27 ? (27 - z) / 21 : 0);
const sMed = z => (z < 22 || z > 67 ? 0 : z <= 43 ? (z - 22) / 21 : (67 - z) / 24);
const sHigh = z => (z < 58 ? 0 : z < 75 ? (z - 58) / 17 : 1);
const agg3 = z => Math.max(Math.min(R1, sLow(z)), Math.min(R2, sMed(z)), Math.min(R3, sHigh(z)));
const B1 = 22 + R1 * 21, B2 = 22 + R2 * 21, B3 = 67 - R2 * 24; // 24.1, 26.2, 62.2
const P3 = [
  piece(0, B1, R1, 0),
  piece(B1, B2, -22 / 21, 1 / 21),
  piece(B2, B3, R2, 0),
  piece(B3, 67, 67 / 24, -1 / 24),
];
const A3 = P3.reduce((s, p) => s + p.area, 0);   // 10.405
const M3 = P3.reduce((s, p) => s + p.moment, 0); // 385.86
const Z3 = M3 / A3;                               // 37.08
const BIS3 = B2 + (A3 / 2 - P3[0].area - P3[1].area) / R2; // 38.59
const D3 = (() => { let n = 0, d = 0; for (let z = 0; z <= 100; z += 10) { n += z * agg3(z); d += agg3(z); } return [n, d, n / d]; })();
// With the exact reading μ_cold(29) = 1/15 instead of 0.1:
const Z3exact = (() => {
  const c = 1 / 15, f = z => Math.max(Math.min(c, sLow(z)), Math.min(R2, sMed(z)));
  let n = 0, d = 0; const h = 0.001;
  for (let z = h / 2; z < 100; z += h) { n += z * f(z) * h; d += f(z) * h; }
  return n / d;
})();

// ---------------------------------------------------------------- homework 4
const muH = x => (x < 25 || x > 45 ? 0 : x <= 38 ? (x - 25) / 13 : x <= 40 ? 1 : 9 - x / 5);
const muV = y => (y < 2500 || y > 4500 ? 0 : y <= 3000 ? y / 500 - 5 : y <= 3500 ? 1 : 4.5 - y / 1000);
const AL = muH(28);                  // 3/13
const Y1 = 2500 + 500 * AL;          // 2615.38
const Y2 = 4500 - 1000 * AL;         // 4269.23
const P4 = [
  { name: 'مثلث چپ', a: 2500, b: Y1, area: 0.5 * (Y1 - 2500) * AL, c: 2500 + (2 / 3) * (Y1 - 2500) },
  { name: 'مستطیل', a: Y1, b: Y2, area: (Y2 - Y1) * AL, c: (Y1 + Y2) / 2 },
  { name: 'مثلث راست', a: Y2, b: 4500, area: 0.5 * (4500 - Y2) * AL, c: Y2 + (4500 - Y2) / 3 },
];
const A4 = P4.reduce((s, p) => s + p.area, 0);         // 421.60
const M4 = P4.reduce((s, p) => s + p.area * p.c, 0);   // 1 463 814
const C4 = M4 / A4;                                     // 3472.06
const BIS4 = Y1 + (A4 / 2 - P4[0].area) / AL;           // 3471.15
const MOM4 = (Y1 + Y2) / 2;                             // 3442.31

}
// Member-by-member table for discrete fuzzy sets: a header row of x values, then one row per set.

const fillShape = (b, g, id, pts, color) =>
  b.path(id, 'M' + pts.map(([v, m]) => `${g.X(v).toFixed(1)} ${g.Y(m).toFixed(1)}`).join('L') + 'Z', { color, fill: color, width: 1.5, dur: 300 });
// One row per piece: name, area, balance point, area × balance point; then totals, the rule, the result.
async function pieceTable(b, rows, totals, result) {

    b.write(`th${k}`, X[k], 100, h, { size: 22, color: 'blue', bold: true, dur: 150 })));

    await all(row.map((c, k) => b.write(`tc${r}-${k}`, X[k], 160 + r * 46, c, { size: 20, color: k === 3 ? 'green' : 'ink', dur: 150 })));
  }
  const yt = 160 + rows.length * 46;
  await b.line('tg2', 40, yt - 24, 960, yt - 24, { color: 'soft', width: 2 });
  await all([
    b.write('tt', X[0], yt + 8, 'total', { size: 22, bold: true }),

  await b.write('res', 500, 525, result, { size: 30, color: 'green', bold: true });
}

      solve: async b => {
        const L = [
          ['α = (90 − 60)/40 = 0.75', 'purple'],
          ['y_1 = 10 + 30 × 0.75 = 32.5        y_2 = 100 − 40 × 0.75 = 70', 'purple'],
          ['areas: 8.4375 + 28.125 + 11.25 = 47.8125      half = 23.906', 'ink'],
          ['from rect: 23.906 − 8.4375 = 15.469  →  width = 15.469 / 0.75 = 20.625', 'ink'],
        ];
        for (const [k, [l, c]] of L.entries()) await b.write(`s${k}`, 500, 260 + k * 55, l, { size: 23, color: c, dur: 300 });
        await b.write('res', 500, 520, 'bisector = 32.5 + 20.625 ≈ 53.13', { size: 32, color: 'green', bold: true });
      },
    },
    // ---------------------------------------------------------- exam 6, step by step
    {
      say: 'سؤال 6 قدم‌به‌قدم. قدم 1: 90 بین 60 و 100 است، پس فرمول اول S را می‌گیریم: (90 − 60)/40 = 0.75. قدم 2، برش B در ارتفاع 0.75: ضلع چپ (y − 10)/30 = 0.75، پس y − 10 = 22.5 و y = 32.5. ضلع راست (100 − y)/40 = 0.75، پس 100 − y = 30 و y = 70.',
      tip: true,
      draw: async b => {
        await b.clear();
        await walkTitle(b, 'سؤال 6 گام‌به‌گام · قدم 1 و 2: قدرت قاعده و برش B');
        await GW.axes(b, 'gx', { ticks: [0, 10, 32.5, 40, 60, 70, 100], yTicks: [0.75, 1], label: 'y' });
        await GW.poly(b, 'bb', [[10, 0], [40, 1], [60, 1], [100, 0]], { color: 'soft' });
        await b.write('bl', GW.X(50), GW.Y(1) - 12, 'B', { size: 22, color: 'soft' });
        await b.line('cut', GW.X(0), GW.Y(0.75), GW.X(100), GW.Y(0.75), { color: 'red', width: 2 });
        await b.write('cutl', GW.X(100) + 8, GW.Y(0.75) + 6, 'α = 0.75', { size: 20, color: 'red', anchor: 'start' });
        await fillShape(b, GW, 'clip', [[10, 0], [32.5, 0.75], [70, 0.75], [100, 0]], 'green');
        await all([b.dot('p1', GW.X(32.5), GW.Y(0.75), { color: 'red', r: 6 }), b.dot('p2', GW.X(70), GW.Y(0.75), { color: 'red', r: 6 })]);
        await mathLines(b, [
          ['60 ≤ 90 ≤ 100   →   first formula   →   α = (90 − 60)/40 = 0.75', 'purple'],
          ['left:   (y − 10)/30 = 0.75   →   y − 10 = 0.75 × 30 = 22.5   →   y = 32.5', 'ink'],
          ['right:   (100 − y)/40 = 0.75   →   100 − y = 0.75 × 40 = 30   →   y = 70', 'ink'],
        ], 395, 46, 22);
      },
    },
    {
      say: 'قدم 3، مساحت‌ها: شکل بریده‌شده سه تکه است. مثلث چپ از 10 تا 32.5، یعنی قاعده‌ی 22.5: ½ × 22.5 × 0.75 = 8.4375. مستطیل از 32.5 تا 70، یعنی عرض 37.5: 37.5 × 0.75 = 28.125. مثلث راست از 70 تا 100، یعنی قاعده‌ی 30: ½ × 30 × 0.75 = 11.25. مساحت کل 47.8125 است و نصفش 23.906. bisector خط عمودی‌ای است که شکل را به دو نیمه‌ی هم‌مساحت تقسیم می‌کند.',
      tip: true,
      draw: async b => {
        await b.erase(['w*', 'clip', 'cut', 'cutl']);
        await walkTitle(b, 'قدم 3: مساحت سه تکه و نصف مساحت');
        const P = [
          [[[10, 0], [32.5, 0], [32.5, 0.75]], 'orange', [26, 0.25]],
          [[[32.5, 0], [70, 0], [70, 0.75], [32.5, 0.75]], 'blue', [51, 0.35]],
          [[[70, 0], [100, 0], [70, 0.75]], 'orange', [80, 0.25]],
        ];
        for (const [k, [pts, c]] of P.entries()) await fillShape(b, GW, `pc${k}`, pts, c);
        await all(P.map(([, , [v, m]], k) => b.write(`pn${k}`, GW.X(v), GW.Y(m) + 7, String(k + 1), { size: 20, color: 'ink', bold: true, dur: 150 })));
        await mathLines(b, [
          ['1  triangle 10…32.5:   ½ × 22.5 × 0.75 = 8.4375', 'ink'],
          ['2  rectangle 32.5…70:   37.5 × 0.75 = 28.125', 'ink'],
          ['3  triangle 70…100:   ½ × 30 × 0.75 = 11.25', 'ink'],
          ['total = 47.8125      half = 47.8125 / 2 = 23.906', 'green'],
        ], 380, 42, 21);
      },
    },
    {
      say: 'قدم 4، bisector: از چپ مساحت جمع می‌کنیم تا به نصف، یعنی 23.906، برسیم. مثلث 1 فقط 8.4375 است، کمتر از نصف؛ پس خط داخل مستطیل می‌افتد. هنوز 23.906 − 8.4375 = 15.469 مساحت لازم داریم. در مستطیل ارتفاع 0.75 است، پس عرض لازم 15.469 / 0.75 = 20.625. خط از 32.5 به اندازه‌ی 20.625 جلو می‌رود: 32.5 + 20.625 ≈ 53.13.',
      tip: true,
      draw: async b => {
        await b.erase(['w*', 'pn*']);
        await walkTitle(b, 'قدم 4: خط نصف‌کننده‌ی مساحت');
        await b.dim(['pc*'], 0.35);
        await fillShape(b, GW, 'half', [[10, 0], [32.5, 0.75], [53.125, 0.75], [53.125, 0]], 'green');
        await b.line('bis', GW.X(53.125), GW.Y(0) + 4, GW.X(53.125), GW.Y(1) - 4, { color: 'red', width: 3 });
        await b.write('bisl', GW.X(53.125) + 8, GW.Y(0.9), '53.13', { size: 22, color: 'red', bold: true, anchor: 'start' });
        await mathLines(b, [
          ['triangle 1 = 8.4375 < 23.906   →   the line is inside the rectangle', 'ink'],
          ['still needed:   23.906 − 8.4375 = 15.469', 'ink'],
          ['width = 15.469 / 0.75 = 20.625   →   bisector = 32.5 + 20.625 ≈ 53.13', 'green'],
        ], 395, 46, 22);
      },
    },
  ],
});
