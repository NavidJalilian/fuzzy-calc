// Lesson 26 — slides 273–292 (Part 7: optimization, gradient descent, the worked example, back-propagation).
// Explanations are Persian; numbers, math and technical terms stay in English.
// Slide 284 has an arithmetic slip: ∂J/∂w at w = 1.58 is −24.36, not −24.27 (the next w is 1.82 either way).

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const r2 = v => String(+v.toFixed(2));
const r3 = v => String(+v.toFixed(3));

// ---- the worked example of slides 279–285: y_p = xw + b, b = 0, y_t = 2x, η = 0.01
const XS = [2, 3, 4, 5, 6, 7, 8];
const YT = XS.map(x => 2 * x);
const ETA = 0.01;
const J = w => XS.reduce((s, x, i) => s + (x * w - YT[i]) ** 2, 0) / XS.length;
const dJ = w => (2 / XS.length) * XS.reduce((s, x, i) => s + x * (x * w - YT[i]), 0);
const ITER = []; // [{ w, L, g }] for iterations 1..5, w kept unrounded
for (let w = 1, k = 0; k < 5; k++) { ITER.push({ w, L: J(w), g: dJ(w) }); w -= ETA * dJ(w); }

// Iteration table (right side of the board): iter | w | L | ∂J/∂w
const IT = { x: 600, y: 80, cw: [60, 90, 90, 120], rh: 44 };
const itX = c => IT.x + IT.cw.slice(0, c).reduce((a, v) => a + v, 0) + IT.cw[c] / 2;
const itY = r => IT.y + 14 + IT.rh * (r + 0.72);
async function iterTable(b) {
  const head = ['iter', 'w', 'L', '∂J/∂w'];
  await all(head.map((h, c) => b.write(`it-h${c}`, itX(c), IT.y, h, { size: 24, color: 'blue', bold: true, dur: 150 })));
  const W = IT.cw.reduce((a, v) => a + v, 0);
  await b.line('it-hl', IT.x, IT.y + 14, IT.x + W, IT.y + 14, { color: 'soft', width: 2, dur: 250 });
  for (let c = 1; c < 4; c++) {
    const x = IT.x + IT.cw.slice(0, c).reduce((a, v) => a + v, 0);
    await b.line(`it-v${c}`, x, IT.y - 24, x, IT.y + 14 + 5 * IT.rh, { color: 'soft', width: 2, dur: 150 });
  }
  await all([0, 1, 2, 3, 4].map(r => b.write(`it-${r}-0`, itX(0), itY(r), String(r + 1), { size: 24, color: 'purple', dur: 100 })));
}
const f2 = v => (Number.isInteger(v) ? String(v) : v.toFixed(2)); // table cells: 29, 0.90, -4.30
const cell = (b, r, c, v, color = 'ink') => b.write(`it-${r}-${c}`, itX(c), itY(r), c ? f2(+v) : v, { size: 24, color, dur: 200 });

// Data table of the example (right side): x | y_t | y_p
const DT = { x: 660, y: 70, cw: 95, rh: 40 };
async function dataTable(b) {
  await all(['x', 'y_t', 'y_p'].map((h, c) => b.write(`dt-h${c}`, DT.x + DT.cw * (c + 0.5), DT.y, h, { size: 26, color: 'blue', bold: true, dur: 150 })));

  for (let c = 1; c < 3; c++) await b.line(`dt-v${c}`, DT.x + DT.cw * c, DT.y - 26, DT.x + DT.cw * c, DT.y + 14 + 7 * DT.rh, { color: 'soft', width: 2, dur: 150 });
  for (const [r, x] of XS.entries()) {
    await all([
      b.write(`dt-${r}-0`, DT.x + DT.cw * 0.5, DT.y + 14 + DT.rh * (r + 0.75), String(x), { size: 24, dur: 100 }),

    ]);
  }
}

function quizBoard(n, question, o = { size: 34 }) {
  return async b => {

}

// ---- slides 289–292: the computation graph y = 1 / (1 + e^{-(ab + cd + e)})
const IN = { a: 2, b: -1, c: -3, d: -2, e: -3 };
const F = (() => {
  const f = IN.a * IN.b, g = IN.c * IN.d, h = f + g, i = h + IN.e, j = -i, k = Math.exp(j), l = k + 1, y = 1 / l;
  const dl = -1 / l ** 2, dk = dl, dj = dk * k, di = -dj;
  return { f, g, h, i, j, k, l, y, dl, dk, dj, di, da: di * IN.b, db: di * IN.a, dc: di * IN.d, dd: di * IN.c, de: di };
})();

          `مثال اسلاید: ${LTR('w = 1, J = 29, ∂J/∂w = −58')} ← ${LTR('w = 1.58')}`,
          `در ${LTR('w = 1.58')} شیب ${LTR('−24.36')} است (اسلاید اشتباه نوشته) ← ${LTR('w = 1.82')}`,
          `${LTR('η')} کوچک = کند،  ${LTR('η')} بزرگ = پرش؛ گره × در Backward در ورودی دیگر ضرب می‌کند`,
        ];
        for (const [k, l] of L.entries()) await b.write(`m${k}`, 930, 155 + k * 74, '•  ' + l, { size: 24, anchor: 'start', fa: true });
      },
    },
    // ---------------------------------------------------------- quizzes
    {
      say: 'نوبت شماست! همان مثال اسلاید (x = 2 … 8، y_t = 2x، b = 0). اگر الان w = 1.5 باشد، ∂J/∂w چقدر است؟',
      draw: quizBoard(1, 'x = 2 … 8 ,  y_t = 2x ,  w = 1.5  →  ∂J/∂w = ?'),
      quiz: { answer: ['-29', '−29'], hint: 'میان‌بر: ∂J/∂w = 58 (w − 2). یا فرمول (2/7) Σ x (y_p − y_t).', explain: 'y_p − y_t = −0.5x، پس Σ x(y_p − y_t) = −0.5 × 203 = −101.5 و (2/7)(−101.5) = −29.' },
      solve: async b => {
        await b.write('s1', 500, 240, 'y_p − y_t = (1.5 − 2)x = −0.5x', { size: 34 });
        await b.write('s2', 500, 310, 'Σ x(y_p − y_t) = −0.5 × 203 = −101.5', { size: 34 });
        await b.write('s3', 500, 390, `∂J/∂w = (2/7)(−101.5) = ${r2(dJ(1.5))}`, { size: 40, color: 'green', bold: true });
      },
    },
    {
      say: 'ادامه‌ی همان سؤال: با نرخ یادگیری 0.01، وزن بعدی w چقدر می‌شود؟',
      draw: quizBoard(2, 'w = 1.5 ,  ∂J/∂w = −29 ,  η = 0.01  →  w_new = ?'),
      quiz: { answer: ['1.79'], hint: 'w − η × شیب؛ منهای منفی می‌شود مثبت.', explain: 'w = 1.5 − 0.01 × (−29) = 1.5 + 0.29 = 1.79' },
      solve: async b => {
        await b.write('s1', 500, 260, 'w = 1.5 − 0.01 × (−29)', { size: 40 });
        await b.write('s2', 500, 350, `= 1.5 + 0.29 = ${r2(1.5 - ETA * dJ(1.5))}`, { size: 44, color: 'green', bold: true });
      },
    },
    {
      say: 'یک سؤال مفهومی: در وزن فعلی، ∂J/∂w مثبت است. گرادیان کاهشی با w چه می‌کند؟',
      draw: quizBoard(3, `اگر ${LTR('∂J/∂w > 0')} باشد، ${LTR('w')} چه می‌شود؟`, { size: 36, fa: true }),
      quiz: {
        choices: ['w زیاد می‌شود', 'w کم می‌شود', 'w تغییر نمی‌کند'], correct: 1,
        explain: 'w = w − η × (عدد مثبت)، پس w کم می‌شود. شیب مثبت یعنی سمت راست ته کاسه‌ایم و باید به چپ برویم.',
      },
      solve: async b => {
        await b.write('s1', 500, 260, 'w = w − η × (+)', { size: 44 });
        await b.write('s2', 500, 350, 'w کم می‌شود ←', { size: 40, color: 'green', bold: true, fa: true });
      },
    },
    {
      say: 'اگر نرخ یادگیری η را خیلی بزرگ بگیریم، چه اتفاقی ممکن است بیفتد؟',
      draw: quizBoard(4, `${LTR('η')} خیلی بزرگ ← ؟`, { size: 40, fa: true }),
      quiz: {
        choices: ['آموزش خیلی کند می‌شود', 'از روی مینیموم می‌پریم و ممکن است loss زیاد شود', 'loss همیشه دقیقاً صفر می‌شود'], correct: 1,
        explain: 'قدم بزرگ از ته کاسه رد می‌شود و آن طرف می‌افتد؛ ممکن است هر بار دورتر شود. η کوچک است که آموزش را کند می‌کند.',
      },
      solve: async b => {
        await b.write('s1', 500, 260, `${LTR('η')} کوچک ← کند`, { size: 36, color: 'blue', fa: true });
        await b.write('s2', 500, 340, `${LTR('η')} بزرگ ← پرش از روی مینیموم`, { size: 36, color: 'red', bold: true, fa: true });
      },
    },
    {
      say: 'سؤال آخر، درباره‌ی Backward: گره × با ورودی‌های a = 2 و b = 5. گرادیانی که از بالا به این گره رسیده 3 است. گرادیان نسبت به a چقدر است؟',
      draw: quizBoard(5, 'f = a × b ,  a = 2 ,  b = 5 ,  ∂y/∂f = 3  →  ∂y/∂a = ?'),
      quiz: { answer: ['15'], hint: 'گره × گرادیان را در ورودی دیگرش ضرب می‌کند.', explain: '∂f/∂a = b = 5، پس ∂y/∂a = 3 × 5 = 15.' },
      solve: async b => {
        await b.write('s1', 500, 260, '∂f/∂a = b = 5', { size: 40, color: 'blue' });
        await b.write('s2', 500, 350, `∂y/∂a = 3 × 5 = ${3 * 5}`, { size: 46, color: 'green', bold: true });
      },
    },
  ],
});
