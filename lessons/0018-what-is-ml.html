// A rounded box with a centred label.
async function node(b, id, x, y, w, h, label, o = {}) {
  await b.box(id, x, y, w, h, { color: o.color || 'blue', fill: o.fill ?? (o.color || 'blue'), dur: o.dur ?? 350 });
  const size = o.size || 24;
  await b.write(id + '-t', x + w / 2, y + h / 2 + size / 3, label, { size, fa: FA.test(label), color: o.text || 'ink', bold: o.bold, dur: 250 });
}

// A small "handwritten digit" picture: a dark frame with the digit inside.
function digit(b, id, x, y, d, s = 34) {
  return all([
    b.box(id, x - s / 2, y - s / 2, s, s, { color: 'ink', fill: 'ink', r: 4, dur: 150 }),
    b.write(id + '-d', x, y + s * 0.3, String(d), { size: s * 0.8, dur: 150 }),
  ]);
}

function quizBoard(n, question, o = { size: 34, fa: true }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 5`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 140, question, o);
  };
}
