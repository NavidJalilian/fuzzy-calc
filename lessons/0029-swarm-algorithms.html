// Lesson 29 — slides 316–318 (Part 8: optimization algorithms): PSO, firefly, ant colony.
// The slides describe these three in words only; the pictures and small numbers here are the teacher's own.

const all = list => Promise.all(list);
const QUIZZES = 5;
const round = n => Math.round(n);

function quizBoard(n, lines) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از ${QUIZZES}`, { size: 24, color: 'soft', fa: true });
    for (const [k, l] of lines.entries()) await b.write(`q-l${k}`, 500, 130 + k * 55, l.text, { size: l.size || 34, fa: l.fa, color: l.color || 'ink' });
  };
}

// ---- PSO picture: birds (particles) and one piece of food.
const FOOD = [850, 270];
const BIRDS = [[150, 140], [250, 430], [430, 190], [330, 310], [560, 450], [610, 130], [690, 360], [170, 300]];
const dist = ([x, y]) => Math.hypot(x - FOOD[0], y - FOOD[1]);
const BEST = BIRDS.reduce((bi, p, k) => (dist(p) < dist(BIRDS[bi]) ? k : bi), 0);
// One "round": every bird moves 45% of the way toward the best bird and 25% toward the food it senses.
const step1 = BIRDS.map((p, k) => (k === BEST
  ? [(FOOD[0] - p[0]) * 0.5, (FOOD[1] - p[1]) * 0.5]
  : [(BIRDS[BEST][0] - p[0]) * 0.45 + (FOOD[0] - p[0]) * 0.25, (BIRDS[BEST][1] - p[1]) * 0.45 + (FOOD[1] - p[1]) * 0.25]));
const AFTER1 = BIRDS.map((p, k) => [p[0] + step1[k][0], p[1] + step1[k][1]]);

// ---- Firefly picture: brightness = how good the solution is.
const FLIES = [[200, 330, 0.3], [380, 200, 0.9], [560, 380, 0.5], [760, 250, 0.2]];
const BRIGHTEST = FLIES.reduce((bi, f, k) => (f[2] > FLIES[bi][2] ? k : bi), 0);

Teacher.start({
