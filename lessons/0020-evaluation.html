// Lesson 20 — slides 186–197 (part 6: machine learning). Train / validation / test, holdout, k-fold,
// leave-one-out, random subsampling.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const FA = /[؀-ۿ]/;

async function node(b, id, x, y, w, h, label, o = {}) {
  await b.box(id, x, y, w, h, { color: o.color || 'blue', fill: o.fill ?? (o.color || 'blue'), dur: o.dur ?? 350 });
  const size = o.size || 24;
  await b.write(id + '-t', x + w / 2, y + h / 2 + size / 3, label, { size, fa: FA.test(label), color: o.text || 'ink', bold: o.bold, dur: 250 });
}

function digit(b, id, x, y, d, s = 34) {
  return all([
    b.box(id, x - s / 2, y - s / 2, s, s, { color: 'ink', fill: 'ink', r: 4, dur: 120 }),
    b.write(id + '-d', x, y + s * 0.3, String(d), { size: s * 0.8, dur: 120 }),
  ]);
}

function quizBoard(n, question, o = { size: 30, fa: true }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 140, question, o);
  };
}

// Colours used for the three parts everywhere in this lesson.
const TRAIN = 'green', VALID = 'orange', TEST = 'blue';

// A row of equal cells; test(k) says whether cell k is a test cell (marked with a blue dot).
function cells(b, id, x, y, w, h, n, test) {
  const cw = w / n;
  return all([...Array(n)].map((_, k) => all([
    b.box(`${id}-${k}`, x + k * cw, y, cw, h, { color: test(k) ? TEST : TRAIN, fill: test(k) ? TEST : TRAIN, r: 0, dur: 120 }),
    test(k) ? b.dot(`${id}-${k}d`, x + (k + 0.5) * cw, y + h / 2, { color: TEST, r: Math.min(9, cw / 4) }) : null,
  ])));
}

// The MNIST grid of slide 188: 4 rows × digits 0–9.
const GX = c => 210 + c * 58;
const GY = r => 140 + r * 58;

// The diabetes table of slides 189–192 (only the columns we need to show the split).
const PIMA = [
  [1, 6, 148, 72, 35, 0, 33.6, 0.627, 50, 'Positive'],
  [2, 1, 85, 66, 29, 0, 26.6, 0.351, 31, 'Negative'],
  [3, 8, 183, 64, 0, 0, 23.3, 0.672, 32, 'Positive'],
  [4, 1, 89, 66, 23, 94, 28.1, 0.167, 21, 'Negative'],
  [5, 0, 137, 40, 35, 168, 43.1, 2.288, 33, 'Positive'],
  [6, 5, 116, 74, 0, 0, 25.6, 0.201, 30, 'Negative'],
];
const PH = ['Case', 'preg', 'plas', 'pres', 'skin', 'insu', 'mass', 'pedi', 'age', 'class'];
const TX = [90, 160, 225, 290, 355, 420, 490, 565, 635, 720];
const TY = r => 150 + r * 46;

function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; }
// Random subsampling: in each of 4 rounds, 4 of 20 cells are picked at random as test.
const RANDOM_TEST = (() => {
  const r = rng(11);
  return [0, 1, 2, 3].map(() => {
    const s = new Set();
    while (s.size < 4) s.add(Math.floor(r() * 20));
    return s;
  });
})();
