const fmt = n => String(+(+n).toFixed(4));
const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`;  // keeps a left-to-right run intact inside Persian board text
const RTL = s => `⁧${s}⁩`;  // keeps a Persian quiz choice right-to-left inside its button
const not = v => +(1 - v).toFixed(4);

// Writes one table row: a label at lx, then one value per column. Cell ids: `${id}-${c}`.
async function row(b, id, lx, xs, y, label, vals, o = {}) {
  const size = o.size || 26;
  await b.write(`${id}-l`, lx, y, label, { size, color: o.lc || 'purple', dur: 200 });
  for (const [c, v] of vals.entries()) {
    await b.write(`${id}-${c}`, xs[c], y, fmt(v), { size, color: o.colorOf?.(v, c) || o.color || 'ink', dur: o.dur ?? 170 });
  }
}

// Quiz board: "question n of 6" and the question lines.
function quizBoard(n, lines) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 55, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    for (const [k, [t, o]] of lines.entries()) await b.write(`q-${k}`, 500, 115 + k * 52, t, { size: 32, ...o });
  };
}
