// Lesson 24 — slides 237–260 (Part 7: neural networks).
// Explanations are Persian; numbers, math and technical terms stay as written in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (numbers, math) intact inside Persian board text
const num = v => String(+v.toFixed(6));
const QUIZZES = 6;

async function node(b, id, x, y, r, label, o = {}) {
  const size = o.size || 24;
  await b.ring(id, x, y, r, r, { color: o.color || 'blue', fill: o.fill || o.color || 'blue', tilt: 0, dur: o.dur ?? 250 });
  if (label) await b.write(id + '-t', x, y + size * 0.35, label, { size, bold: true, dur: 120 });
}

// ---- bus vs Pride (slides 242–246): [length, height, isBus]
const CARS = [[7, 4, 1], [6.5, 4.5, 1], [7.5, 4.5, 1], [9, 4.5, 1], [3, 1.5, 0], [2.5, 1.7, 0], [2, 1.6, 0]];
const W = [1, 2];       // weight of length, weight of height (slide 245)
const B = -9;           // -b = 9 is the threshold (slide 246)
const wx = (l, h) => +(W[0] * l + W[1] * h).toFixed(6);
const out = (l, h) => (wx(l, h) + B > 0 ? 1 : 0); // slide 246: 1 if w·x + b > 0, else 0
const G1 = () => Graph({ x: 90, y: 120, w: 360, h: 320, from: 0, to: 10, min: 0, max: 7 });
const TC = { n: 930, l: 865, h: 790, t: 705, s: 600 }; // table columns (right to left, like the slide)
const rowY = r => 150 + r * 40;

// ---- cats vs dogs (slides 247–248), my coordinates copied from the picture's layout
const DOGS = [[5, 8], [6, 7.5], [5.5, 6.8], [6.5, 6.5], [2, 3.5], [1.5, 1.5], [2.5, 1.5], [6.5, 1.5], [7.5, 1.5]];
const CATS = [[2, 6.5], [2.5, 5.8], [1.8, 5.2], [5, 4.5], [5.5, 4], [4.8, 3.5], [7.8, 4.6]];
const G2 = () => Graph({ x: 90, y: 110, w: 380, h: 360, from: 0, to: 10, min: 0, max: 10 });

// ---- XOR (slides 250–251) and my two-hidden-neuron solution
const XOR = [[0, 0], [0, 1], [1, 0], [1, 1]];
const step = z => (z > 0 ? 1 : 0); // none of the z values below is exactly 0
const h1 = (a, c) => step(a + c - 0.5); // OR
const h2 = (a, c) => step(a + c - 1.5); // AND
const xorNet = (a, c) => step(h1(a, c) - h2(a, c) - 0.5);
const XC = { x1: 600, x2: 680, h1: 760, h2: 840, y: 920 };
const G3 = () => Graph({ x: 110, y: 130, w: 320, h: 320, from: 0, to: 2, min: 0, max: 2 });

// ---- km → miles prediction machine (slides 253–259)
const TRUTH = 62.137;
const GUESS = [0.5, 0.6, 0.7, 0.61];
const calc = c => +(100 * c).toFixed(6);
const err = c => +(TRUTH - calc(c)).toFixed(6);
const KC = { c: 220, calc: 410, truth: 600, err: 800 };
const kRow = k => 425 + k * 37;
async function guessRow(b, k) {
  const c = GUESS[k], e = err(c);
  await b.write('cval', 500, 168, `× ${c}`, { size: 26, color: 'red', bold: true, dur: 150 });
  await b.write(`g${k}-c`, KC.c, kRow(k), String(c), { size: 24, color: 'red' });
  await b.write(`g${k}-calc`, KC.calc, kRow(k), num(calc(c)), { size: 24 });
  await b.write(`g${k}-t`, KC.truth, kRow(k), String(TRUTH), { size: 24, color: 'green' });
  await b.write(`g${k}-e`, KC.err, kRow(k), num(e), { size: 24, color: e < 0 ? 'red' : 'orange', bold: true });
}

function quizBoard(n, lines) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از ${QUIZZES}`, { size: 24, color: 'soft', fa: true });
    for (const [k, l] of lines.entries()) await b.write(`q-l${k}`, 500, 130 + k * 52, l.text, { size: l.size || 34, fa: l.fa, color: l.color || 'ink' });
  };
}
async function solveLines(b, lines, y0 = 320) {
  for (const [k, l] of lines.entries()) await b.write(`s-l${k}`, 500, y0 + k * 52, l.text, { size: l.size || 30, fa: l.fa, color: l.color || 'ink', bold: l.bold });
}
