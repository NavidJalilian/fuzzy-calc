// Lesson 30 — slides 319–324 (Part 8: optimization algorithms): the genetic algorithm and the
// travelling-salesman example. Slides 320–324 are scanned pages; every number here was recomputed.

const all = list => Promise.all(list);
const QUIZZES = 6;

function quizBoard(n, lines) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از ${QUIZZES}`, { size: 24, color: 'soft', fa: true });
    for (const [k, l] of lines.entries()) await b.write(`q-l${k}`, 500, 130 + k * 55, l.text, { size: l.size || 34, fa: l.fa, color: l.color || 'ink' });
  };
}

// A chromosome: a row of gene boxes, left to right, like the slides draw them.
// genes: labels such as 'X_1'; red: indexes drawn in red (genes that changed).
async function chromo(b, id, x, y, genes, { cell = 64, red = [], color = 'ink', label } = {}) {
  if (label) await b.write(`${id}-n`, x - 34, y + 8, label, { size: 24, color: 'purple', bold: true, dur: 150 });
  for (const [k, g] of genes.entries()) {
    await b.box(`${id}-b${k}`, x + k * cell, y - 25, cell, 50, { color, r: 4, dur: 120 });
    await b.write(`${id}-g${k}`, x + k * cell + cell / 2, y + 9, g, { size: 24, color: red.includes(k) ? 'red' : 'ink', bold: red.includes(k), dur: 100 });
  }
}
const X = (...n) => n.map(k => `X_${k}`);
const C = (...n) => n.map(k => `C_${k}`);

// ---- Travelling salesman, slide 323: 6 cities and the road lengths between them.
// The picture labels the C6–C4 road "8", but the slide's own sum on slide 324 uses 80.
const ROADS = { '6-1': 100, '1-2': 120, '2-3': 50, '3-4': 300, '4-5': 150, '5-6': 170, '6-4': 80, '6-3': 70, '4-1': 75, '5-2': 200 };
const road = (a, c) => ROADS[`${a}-${c}`] ?? ROADS[`${c}-${a}`];
// Fitness of slide 324: the total length of the trip, city to city in the chromosome's order.
const fit = tour => tour.slice(1).reduce((s, c, i) => s + road(tour[i], c), 0);
const legs = tour => tour.slice(1).map((c, i) => road(tour[i], c));
const K1 = [1, 2, 3, 4, 5, 6], K2 = [5, 4, 6, 1, 2, 3], K3 = [5, 6, 4, 1, 2, 3], BEST = [2, 3, 6, 1, 4, 5];
const POS = { 6: [300, 150], 1: [700, 150], 5: [140, 290], 2: [860, 290], 4: [300, 430], 3: [700, 430] };
const LABEL = { '6-1': [500, 132], '1-2': [808, 205], '2-3': [808, 385], '3-4': [500, 465], '4-5': [192, 385], '5-6': [192, 205],
  '6-4': [280, 365], '6-3': [445, 222], '4-1': [445, 372], '5-2': [770, 278] };
const fact = n => (n <= 1 ? 1 : n * fact(n - 1));

async function drawMap(b) {
  for (const k of Object.keys(ROADS)) {
    const [a, c] = k.split('-');
    await b.line(`e${k}`, ...POS[a], ...POS[c], { color: 'soft', width: 2, dur: 150 });
  }
  for (const [c, [x, y]] of Object.entries(POS)) {
    await b.dot(`c${c}`, x, y, { r: 9 });
    const [lx, ly] = y === 290 ? [x + (x < 500 ? -50 : 50), y + 10] : [x, y + (y < 290 ? -20 : 42)];
    await b.write(`cl${c}`, lx, ly, `C_${c}`, { size: 28, bold: true, dur: 100 });
  }
  await all(Object.entries(LABEL).map(([k, [x, y]]) => b.write(`el${k}`, x, y, String(ROADS[k]), { size: 22, color: 'purple', dur: 100 })));
}
// Highlights a trip on the map.
async function drawTrip(b, id, tour, color) {
  await b.wire(id, tour.map(c => POS[c]), { color, width: 6, dur: 900 });
}
