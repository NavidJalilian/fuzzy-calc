// Lesson 10 — slides 87–94 (Part 3: membership function shapes — gaussmf, gauss2mf, gbellmf, zmf/smf/pimf, sigmoid).
// Explanations are Persian; numbers, math and technical terms stay in English.
// Formulas not on the slides (gauss2mf pieces, smf/zmf, sigmf, roles of a/b/c in gbellmf) are from the MathWorks docs.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const r = (v, d = 3) => String(+v.toFixed(d));

// MATLAB membership functions.
const gauss = (s, c) => x => Math.exp(-((x - c) ** 2) / (2 * s * s));
const pdf = (s, c) => x => gauss(s, c)(x) / (Math.sqrt(2 * Math.PI) * s); // slide 87's second formula (probability density)
const gauss2 = (s1, c1, s2, c2) => x => (x <= c1 ? gauss(s1, c1)(x) : 1) * (x >= c2 ? gauss(s2, c2)(x) : 1);
const bell = (a, bb, c) => x => 1 / (1 + Math.abs((x - c) / a) ** (2 * bb));
const sig = (a, c) => x => 1 / (1 + Math.exp(-a * (x - c)));
const smf = (a, b) => x => (x <= a ? 0 : x >= b ? 1 : x <= (a + b) / 2 ? 2 * ((x - a) / (b - a)) ** 2 : 1 - 2 * ((x - b) / (b - a)) ** 2);
const zmf = (a, b) => x => 1 - smf(a, b)(x);
const pimf = (a, b, c, d) => x => smf(a, b)(x) * zmf(c, d)(x);
const S = sig(1, 0); // slide 93's S(x)

// Big graph on the left, working in the right column (x 600–960).
const GL = (from = 0, to = 10) => Graph({ x: 110, y: 120, w: 420, h: 270, from, to });

// A chain of operations: items at xs, arrows between given gaps, captions below.
async function chain(b, id, y, items, xs, gaps, caps) {
  for (const [k, it] of items.entries()) {
    await b.write(`${id}${k}`, xs[k], y, it, { size: 30, color: k === items.length - 1 ? 'green' : 'ink', dur: 350 });
    await b.write(`${id}c${k}`, xs[k], y + 48, caps[k], { size: 20, color: 'soft', fa: true, dur: 200 });
    if (k < items.length - 1) await b.arrow(`${id}a${k}`, gaps[k][0], y - 10, gaps[k][1], y - 10, { color: 'orange', head: 10, dur: 250 });
  }
}

const QN = 6;
function quizBoard(n, question, o = {}) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 52, `سؤال ${n} از ${QN}`, { size: 22, color: 'soft', fa: true });
    await b.write('q-q', 500, 110, question, { size: 32, ...o });
  };
}
const GQ = (from = 0, to = 10) => Graph({ x: 120, y: 200, w: 440, h: 250, from, to });

          'اسلاید 94: گاوسی و زنگوله‌ای هموار و همه‌جا غیرصفرند؛ ولی متقارن',
        ];
        for (const [k, l] of L.entries()) await b.write(`m${k}`, 945, 150 + k * 64, '•  ' + l, { size: 23, anchor: 'start', fa: true });
      },
    },
