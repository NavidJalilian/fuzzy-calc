// Lesson 14 — slides 108–115 (part 4: the Mamdani fuzzy inference system, steps 1–3).
// Aggregation and defuzzification (steps 4–5) are lesson 15.
// Explanations are Persian; numbers, math and technical terms stay in English.
//
// One running example (wind x = 8, pressure y = 5, rain z) grows through the lesson, and every
// section ends with a short check question on it:
//   start. the five parts of an FIS, Mamdani vs Sugeno   → which type if the output were z = 0.5x + y
//   1. fuzzification                                     → μ_B2(5) = 0.7
//   2. fuzzy operators (min / prod, max / probor)        → α2 = 0.2, probor(0.2, 0.7) = 0.76
//   3. implication (min clips, prod scales)              → μ_C1′(7.5) with prod = 0.225, C2′ top starts at 2.4

const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const all = list => Promise.all(list);
const fmt = n => String(+n.toFixed(4));

// Membership-function shapes.
const tri = (a, m, c) => v => Math.max(0, Math.min((v - a) / (m - a), (c - v) / (c - m)));
const ramp = (a, c) => v => Math.max(0, Math.min(1, (v - a) / (c - a)));   // 0 before a, rises to 1 at c
const fall = (a, c) => v => Math.max(0, Math.min(1, (c - v) / (c - a)));   // 1 before a, falls to 0 at c
const gaussmf = (s, c) => v => Math.exp(-((v - c) ** 2) / (2 * s * s));     // MATLAB gaussmf(x, [σ c])
const probor = (a, b) => a + b - a * b;

// The wind / pressure / rain example (slides 109–117). The slides give only pictures and the
// readings 0.6, 0.2 (x = 8) and 0.3, 0.7 (y = 5); these straight lines pass through the same readings.
const A1 = ramp(5, 10);        // «شدید»  (strong)
const A2 = tri(3, 6, 8.5);     // «متوسط» (medium)
const B1 = fall(2.9, 5.9);     // «پایین» (low)
const B2 = ramp(2.9, 5.9);     // «بالا»  (high)
const C1 = tri(5, 7, 9);       // «زیاد»  (heavy rain) — our numbers
const C2 = tri(2, 4, 6);       // «کم»    (light rain) — our numbers
const X0 = 8, Y0 = 5;
const MU = { A1: A1(X0), A2: A2(X0), B1: B1(Y0), B2: B2(Y0) };   // 0.6, 0.2, 0.3, 0.7
const AL1 = Math.min(MU.A1, MU.B1), AL2 = Math.min(MU.A2, MU.B2); // 0.3, 0.2
const CUT1 = [5 + 2 * AL1, 9 - 2 * AL1];                          // 5.6 … 8.4
const CUT2 = [2 + 2 * AL2, 6 - 2 * AL2];                          // 2.4 … 5.6

// A filled region under μ = f(v) between lo and hi.
function shade(b, g, id, f, lo, hi, color = 'green', dur = 700) {
  const pts = [[lo, 0]];
  for (let k = 0; k <= 100; k++) { const v = lo + ((hi - lo) * k) / 100; pts.push([v, f(v)]); }
  pts.push([hi, 0]);
  const d = 'M' + pts.map(([v, m]) => `${g.X(v).toFixed(1)} ${g.Y(m).toFixed(1)}`).join('L') + 'Z';
  return b.path(id, d, { color, fill: color, width: 2.5, dur });
}

// The three graphs of the example (x, y, z).
const GX = Graph({ x: 80, y: 270, w: 210, h: 150, from: 0, to: 12 });
const GY = Graph({ x: 380, y: 270, w: 210, h: 150, from: 0, to: 10 });
const GZ = Graph({ x: 690, y: 270, w: 210, h: 150, from: 0, to: 10 });
// Board y of μ on the rule-2 row of the operator steps (section 2).
const R2Y = m => 330 + 120 * (1 - m);
// The big output graph used for implication.
const GC = Graph({ x: 120, y: 150, w: 560, h: 300, from: 0, to: 10 });

// Rule 2 after min implication: the clipped C2′ on the big output graph, with its cut points.
async function rule2Cut(b) {
  await shade(b, GC, 'o2', z => Math.min(AL2, C2(z)), 2, 6, 'purple');
  await all([b.dot('cd1', GC.X(CUT2[0]), GC.Y(AL2), { color: 'red' }), b.dot('cd2', GC.X(CUT2[1]), GC.Y(AL2), { color: 'red' })]);
  await all([
    b.write('ct1', GC.X(CUT2[0]), GC.Y(0) + 48, fmt(CUT2[0]), { size: 18, color: 'red' }),
    b.write('ct2', GC.X(CUT2[1]), GC.Y(0) + 48, fmt(CUT2[1]), { size: 18, color: 'red' }),
    b.write('t2', GC.X(4), GC.Y(AL2) - 12, "C2' (α = 0.2)", { size: 20, color: 'purple', bold: true }),
  ]);
}

// Small orange tag that marks a section check question on the board (n = 0 → the start section).
const checkTag = (b, n, x = 905, y = 52) =>
  b.write('chk', x, y, n ? `سؤال بخش ${n}` : 'سؤال شروع', { size: 20, color: 'orange', bold: true, fa: true });

// Final quiz board.
function quizBoard(n, lines) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 52, `سؤال پایانی ${n} از 6`, { size: 22, color: 'soft', fa: true });
    for (const [k, l] of lines.entries()) {
      await b.write(`q-${k}`, 500, 108 + k * 50, l.t, { size: l.size || 30, color: l.color || 'ink', fa: !!l.fa });
    }
  };
}
