const all = list => Promise.all(list);
const LTR = s => s; // the player now keeps English / number runs in order inside Persian text by itself

// Square brackets around a column of entries, from y1 to y2, at x1 (left) and x2 (right).
function brackets(b, id, x1, x2, y1, y2, o = {}) {
  const c = o.color || 'ink';
  return all([
    b.path(`${id}-l`, `M${x1 + 10} ${y1}L${x1} ${y1}L${x1} ${y2}L${x1 + 10} ${y2}`, { color: c, dur: 300 }),
    b.path(`${id}-r`, `M${x2 - 10} ${y1}L${x2} ${y1}L${x2} ${y2}L${x2 - 10} ${y2}`, { color: c, dur: 300 }),
  ]);
}
// A grid of rows × cols cells with top-left corner (x, y) and cell size s; cells are `${id}-${r}-${c}`.
function cells(b, id, x, y, rows, cols, s, o = {}) {
  const list = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    list.push(b.box(`${id}-${r}-${c}`, x + c * s, y + r * s, s, s, { color: o.color || 'blue', fill: o.fill, r: 2, dur: o.dur ?? 60 }));
  }
  return all(list);
}

// Slide 140/141: x ∈ R^{3×5×6} drawn as three 5×6 sheets.
const S = 30;                                          // cell size
const SHEET = [[150, 300], [400, 210], [650, 120]];    // top-left corner of sheet k
const cellXY = (k, i, j) => [SHEET[k][0] + j * S + S / 2, SHEET[k][1] + i * S + S / 2];
async function tensor356(b) {
  for (const [k, [x, y]] of SHEET.entries()) {
    await cells(b, `s${k}`, x, y, 5, 6, S, { color: ['blue', 'purple', 'green'][k], dur: 40 });
    await b.write(`sk${k}`, x + 90, y - 12, `k = ${k}`, { size: 22, color: ['blue', 'purple', 'green'][k], bold: true });
  }
  await all([0, 1, 2, 3, 4].map(i => b.write(`ri${i}`, 132, SHEET[0][1] + i * S + 22, String(i), { size: 18, color: 'soft', dur: 80 })));
  await all([0, 1, 2, 3, 4, 5].map(j => b.write(`cj${j}`, SHEET[0][0] + j * S + S / 2, 472, String(j), { size: 18, color: 'soft', dur: 80 })));
  await b.write('rl', 100, 370, 'i', { size: 24, color: 'soft' });
  await b.write('cl', 240, 500, 'j', { size: 24, color: 'soft' });
}

function quizBoard(n, question, o = { size: 44 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 140, question, o);
  };
}
