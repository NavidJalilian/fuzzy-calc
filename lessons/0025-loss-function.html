const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const r2 = v => String(+v.toFixed(2));

const mse = (yp, yt) => yp.reduce((s, p, i) => s + (p - yt[i]) ** 2, 0) / yp.length;

// A table drawn cell by cell. Cell ids: `${id}-${row}-${col}`, header ids: `${id}-h${col}`.
async function table(b, id, x0, y0, colW, rowH, head, rows, o = {}) {
  const size = o.size || 26;
  const W = colW * head.length;
  await all(head.map((h, c) => b.write(`${id}-h${c}`, x0 + colW * (c + 0.5), y0, h, { size, color: 'blue', bold: true, dur: 150 })));
  await b.line(`${id}-hl`, x0, y0 + 14, x0 + W, y0 + 14, { color: 'soft', width: 2, dur: 250 });
  for (let c = 1; c < head.length; c++) await b.line(`${id}-v${c}`, x0 + colW * c, y0 - 26, x0 + colW * c, y0 + 14 + rows.length * rowH, { color: 'soft', width: 2, dur: 200 });
  for (const [r, row] of rows.entries()) {
    await all(row.map((v, c) => (v === '' ? null : b.write(`${id}-${r}-${c}`, x0 + colW * (c + 0.5), y0 + 14 + rowH * (r + 0.75), v, { size, color: (o.colors && o.colors[c]) || 'ink', dur: 120 }))));
  }
}
// Fills one column of an existing table.
async function column(b, id, x0, y0, colW, rowH, c, head, vals, color, extra = 0) {
  await b.write(`${id}-h${c}`, x0 + colW * (c + 0.5), y0, head, { size: 26, color: 'blue', bold: true, dur: 150 });
  for (const [r, v] of vals.entries()) await b.write(`${id}-${r}-${c}`, x0 + colW * (c + 0.5), y0 + 14 + rowH * (r + 0.75), v, { size: 26, color, dur: 140 });
  if (extra) await b.line(`${id}-hl${c}`, x0 + colW * c, y0 + 14, x0 + colW * (c + 1), y0 + 14, { color: 'soft', width: 2, dur: 150 });
}

function quizBoard(n, question, o = { size: 34 }) {

}

}
