// Lesson 12 — slides 96–101 (part 4: fuzzy reasoning).
// Explanations are Persian; numbers, math and technical terms stay in English.

const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const all = list => Promise.all(list);
const fmt = n => String(+n.toFixed(4));

// Membership-function shapes.
const tri = (a, m, c) => v => Math.max(0, Math.min((v - a) / (m - a), (c - v) / (c - m)));
const trap = (a, p, q, d) => v => Math.max(0, Math.min(1, (v - a) / (p - a), (d - v) / (d - q)));
const ramp = (a, c) => v => Math.max(0, Math.min(1, (v - a) / (c - a)));   // 0 before a, rises to 1 at c
const fall = (a, c) => v => Math.max(0, Math.min(1, (c - v) / (c - a)));   // 1 before a, falls to 0 at c
const bell = (c, s) => v => Math.exp(-((v - c) ** 2) / (2 * s * s));

// The wind / pressure / rain example of slides 99–101. The slides give only pictures and the
// readings 0.6 and 0.3; these straight lines pass through the same readings.
const STRONG = ramp(5, 10);   // A = «شدید»: x = 8 → 0.6
const LOW = fall(2.9, 5.9);   // B = «پایین»: y = 5 → 0.3
const HEAVY = tri(5, 7, 9);   // C = «زیاد» (our numbers: feet 5 and 9, peak 7)
const X0 = 8, Y0 = 5;
const MA = STRONG(X0), MB = LOW(Y0), ALPHA = Math.min(MA, MB);   // 0.6, 0.3, 0.3
const CLIP = [5 + 2 * ALPHA, 9 - 2 * ALPHA];                       // flat top of C′: 5.6 … 8.4

// A filled region under μ = f(v) between lo and hi.
function shade(b, g, id, f, lo, hi, color = 'green') {
  const pts = [[lo, 0]];
  for (let k = 0; k <= 80; k++) { const v = lo + ((hi - lo) * k) / 80; pts.push([v, f(v)]); }
  pts.push([hi, 0]);
  const d = 'M' + pts.map(([v, m]) => `${g.X(v).toFixed(1)} ${g.Y(m).toFixed(1)}`).join('L') + 'Z';
  return b.path(id, d, { color, fill: color, width: 2.5, dur: 700 });
}

// Persian label on the right, formal English line starting at x = 200.
async function row(b, id, y, fa, en, color = 'ink', size = 30) {
  await b.write(`${id}-fa`, 840, y, fa, { size: size - 2, color: 'purple', bold: true, fa: true });
  await b.write(`${id}-en`, 200, y, en, { size, color, anchor: 'start' });
}

// The three small graphs of the slide-99 example (x, y, z).
const GX = Graph({ x: 80, y: 280, w: 210, h: 150, from: 0, to: 12 });
const GY = Graph({ x: 380, y: 280, w: 210, h: 150, from: 0, to: 10 });
const GZ = Graph({ x: 690, y: 280, w: 210, h: 150, from: 0, to: 10 });

// The big graph of C used for implication.
const GC = Graph({ x: 120, y: 150, w: 600, h: 300, from: 0, to: 10 });

// Quiz helpers.
function quizBoard(n, lines) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 52, `سؤال ${n} از 6`, { size: 22, color: 'soft', fa: true });
    for (const [k, l] of lines.entries()) {
      await b.write(`q-${k}`, 500, 108 + k * 50, l.t, { size: l.size || 30, color: l.color || 'ink', fa: !!l.fa });
    }
  };
}
// Small graph of C clipped at α, used by the implication quizzes.
async function clipSolve(b, alpha, at) {
  const g = Graph({ x: 170, y: 300, w: 450, h: 170, from: 4.5, to: 9.5 });
  await g.axes(b, 's-ax', { ticks: [5, 7, 9], yTicks: [1], label: 'z' });
  await g.curve(b, 's-c', HEAVY, { color: 'soft', dur: 600 });
  await g.poly(b, 's-al', [[4.5, alpha], [9.5, alpha]], { color: 'orange', width: 2, dur: 400 });
  await b.write('s-alt', g.X(9.5) + 8, g.Y(alpha) + 7, `α = ${fmt(alpha)}`, { size: 20, color: 'orange', anchor: 'start' });
  const lo = 5 + 2 * alpha, hi = 9 - 2 * alpha;
  await shade(b, g, 's-clip', z => Math.min(alpha, HEAVY(z)), 5, 9, 'green');
  if (at != null) {
    await g.guide(b, 's-g', at, Math.min(alpha, HEAVY(at)), { color: 'blue' });
    await b.write('s-at', g.X(at), g.Y(0) + 26, fmt(at), { size: 18, color: 'blue' });
    await b.write('s-e1', 820, 330, `μ_C(${fmt(at)}) = ${fmt(HEAVY(at))}`, { size: 22, color: 'blue' });
    await b.write('s-e2', 820, 375, `min(${fmt(alpha)}, ${fmt(HEAVY(at))}) = ${fmt(Math.min(alpha, HEAVY(at)))}`, { size: 24, color: 'green', bold: true });
  } else {
    await all([b.dot('s-d1', g.X(lo), g.Y(alpha), { color: 'red' }), b.dot('s-d2', g.X(hi), g.Y(alpha), { color: 'red' })]);
  }
}
