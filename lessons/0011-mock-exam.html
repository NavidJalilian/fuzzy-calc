// Lesson 11 — mock exam for parts 1–3 (lessons 1–10, slides 15–94).
// Five worked problems shaped like homework 1 and 2, then 10 exam questions.
// Explanations are Persian; numbers, math and technical terms stay in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const r = (v, d = 3) => String(+v.toFixed(d));
const sum = a => a.reduce((s, v) => s + v, 0);

// Membership functions (lessons 9–10).
const trimf = (x, [a, b, c]) => (x === b ? 1 : x <= a || x >= c ? 0 : x < b ? (x - a) / (b - a) : (c - x) / (c - b));
const trapmf = (x, [a, b, c, d]) => (x >= b && x <= c ? 1 : x <= a || x >= d ? 0 : x < b ? (x - a) / (b - a) : (d - x) / (d - c));
const gauss = (s, c) => x => Math.exp(-((x - c) ** 2) / (2 * s * s));
const bell = (a, bb, c) => x => 1 / (1 + Math.abs((x - c) / a) ** (2 * bb));
const sig = (a, c) => x => 1 / (1 + Math.exp(-a * (x - c)));
// Hedges (slides 52–53).
const indeed = m => (m <= 0.5 ? 2 * m * m : 1 - 2 * (1 - m) ** 2);

// ---- Problem 1 (like HW1 Q1): X = {1..6}
const P1 = { A: [0.3, 0.8, 1, 0, 0.5, 0], B: [0, 0.6, 0.2, 0.9, 0.4, 1] };
P1.nA = P1.A.map(v => 1 - v);
P1.nB = P1.B.map(v => 1 - v);
P1.uAB = P1.A.map((v, k) => Math.max(v, P1.B[k]));
P1.iAB = P1.A.map((v, k) => Math.min(v, P1.B[k]));
P1.iAnA = P1.A.map((v, k) => Math.min(v, P1.nA[k]));
P1.uBnA = P1.B.map((v, k) => Math.max(v, P1.nA[k]));
const C1 = k => 330 + k * 105; // column x for element k

// ---- Problem 2 (like HW1 Q2): Hot
const HX = [15, 20, 25, 30, 35, 40], HM = [0, 0.3, 0.5, 0.6, 0.9, 1];

// ---- Problem 3: rule matrix + max-min + weighted average
const P3 = { x: [10, 15, 20, 25, 30], a: [0, 0.4, 1, 0.7, 0.2], y: [100, 200, 300, 400], b: [0.2, 0.6, 1, 0.5], x0: 3 };
P3.R = P3.a.map(a => P3.b.map(bj => Math.min(a, bj)));
P3.B = P3.b.map((_, j) => Math.max(...P3.a.map((_, i) => Math.min(i === P3.x0 ? P3.a[i] : 0, P3.R[i][j]))));
P3.num = sum(P3.B.map((m, j) => m * P3.y[j]));
P3.den = sum(P3.B);

// ---- Problem 4: max-product (like HW2)
const P4 = { x: [10, 20, 30, 40, 50], a: [0.1, 0.3, 0.6, 0.9, 1], y: [1, 2, 3, 4], b: [0.2, 0.5, 0.8, 1], x0: 2 };
P4.R = P4.a.map(a => P4.b.map(bj => a * bj));
P4.B = P4.b.map((_, j) => Math.max(...P4.a.map((_, i) => (i === P4.x0 ? P4.a[i] : 0) * P4.R[i][j])));
P4.num = sum(P4.B.map((m, j) => m * P4.y[j]));
P4.den = sum(P4.B);
// The other reading of slide 80: min matrix, product composition.
P4.Bmin = P4.b.map(bj => P4.a[P4.x0] * Math.min(P4.a[P4.x0], bj));
P4.alt = sum(P4.Bmin.map((m, j) => m * P4.y[j])) / sum(P4.Bmin);

// A matrix table: rows (x with degree), columns (y with degree), cells `${id}-i-j`.
async function matrix(b, id, top, P, R, o = {}) {
  const cx = j => 420 + j * 130, ry = i => top + 55 + i * (o.gap || 50);
  await b.write(`${id}-c`, 250, top, 'x \\ y', { size: 22, color: 'soft' });
  await all(P.y.map((y, j) => b.write(`${id}-h${j}`, cx(j), top, `${y} (${P.b[j]})`, { size: 22, color: 'blue', dur: 150 })));
  await b.line(`${id}-hl`, 180, top + 15, 900, top + 15, { color: 'soft', width: 2 });
  await b.line(`${id}-vl`, 330, top - 25, 330, ry(P.x.length - 1) + 15, { color: 'soft', width: 2 });
  for (const [i, x] of P.x.entries()) {
    await b.write(`${id}-r${i}`, 250, ry(i), `${x} (${P.a[i]})`, { size: 22, color: 'blue', dur: 150 });
    await all(R[i].map((v, j) => b.write(`${id}-${i}-${j}`, cx(j), ry(i), r(v), { size: 24, dur: 100 })));
  }
}

const QN = 10;
function quizBoard(n, question, o = {}) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 52, `سؤال ${n} از ${QN}`, { size: 22, color: 'soft', fa: true });
    await b.write('q-q', 500, 110, question, { size: 32, ...o });
  };
}
