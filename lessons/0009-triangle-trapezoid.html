<script>
// Lesson 9 — slides 82–86 (Part 3: membership function shapes — trimf, trapmf).
// Explanations are Persian; numbers, math and technical terms stay in English.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const r = (v, d = 3) => String(+v.toFixed(d));

// MATLAB trimf / trapmf, written piece by piece like the slides.
const trimf = (x, [a, b, c]) => (x === b ? 1 : x <= a || x >= c ? 0 : x < b ? (x - a) / (b - a) : (c - x) / (c - b));
const trapmf = (x, [a, b, c, d]) => (x >= b && x <= c ? 1 : x <= a || x >= d ? 0 : x < b ? (x - a) / (b - a) : (d - x) / (d - c));
// Corner points for Graph.poly.
const triPts = ([a, b, c], from = 0, to = 10) => [[from, 0], [a, 0], [b, 1], [c, 0], [to, 0]];
const trapPts = ([a, b, c, d], from = 0, to = 10) => [[from, 0], [a, 0], [b, 1], [c, 1], [d, 0], [to, 0]];

// Big graph on the left, formulas in the right column (x 600–960).
const GL = () => Graph({ x: 110, y: 120, w: 420, h: 270, from: 0, to: 10 });
// Graph on the right, code box on the left (slides 84 and 86).
const GR = () => Graph({ x: 560, y: 110, w: 360, h: 250, from: 0, to: 10 });

async function codeBox(b, lines) {
  await b.box('cb', 50, 70, 410, 190, { color: 'soft' });
  for (const [k, l] of lines.entries()) await b.write(`cb${k}`, 70, 115 + k * 40, l, { size: 22, anchor: 'start', dur: 250 });
}

const QN = 6;
function quizBoard(n, question, o = {}) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 52, `سؤال ${n} از ${QN}`, { size: 22, color: 'soft', fa: true });
    await b.write('q-q', 500, 110, question, { size: 32, ...o });
  };
}
// Quiz graph: question on top, graph below-left, working on the right.
const GQ = (from = 0, to = 10) => Graph({ x: 120, y: 200, w: 440, h: 250, from, to });

// Slide 84 and 86 examples
const T = [3, 6, 8];
const Z = [1, 5, 7, 8];

Teacher.start({
  id: 'L09',
  number: 9,
  title: 'توابع عضویت مثلثی و ذوزنقه‌ای',
  chapter: 'بخش 3 · شکل توابع عضویت',
  slides: '82–86',
  intro: 'با سه یا چهار گوشه، μ(x) را برای هر x با دست حساب کن — trimf و trapmf.',
  next: { href: '0010-gaussian-bell-sigmoid.html', title: 'گاوسی، زنگوله‌ای، سیگموئید و چندجمله‌ای' },
  steps: [
    // ---------------------------------------------------------- 1. intro
    {
      say: 'سلام! به بخش 3 خوش آمدید: شکل توابع عضویت. تا اینجا μ را آماده، به شکل جدول یا نمودار، می‌گرفتیم. حالا می‌خواهیم خودمان آن را با *فرمول* بسازیم، همان‌طور که نرم‌افزار متلب (MATLAB) می‌سازد. این درس دو شکل ساده دارد: مثلث با دستور trimf و ذوزنقه با دستور trapmf.',
      draw: async b => {
        await b.write('t1', 500, 170, 'بخش 3', { size: 64, color: 'blue', bold: true, fa: true });
        await b.write('t2', 500, 255, 'شکل توابع عضویت', { size: 46, fa: true });
        await b.write('t3', 500, 325, 'Membership function shapes', { size: 38, color: 'orange' });
        await b.write('t4', 500, 420, 'trimf   ·   trapmf', { size: 42, color: 'purple', bold: true });
      },
    },
    // ---------------------------------------------------------- 2. slide 82: the only rule
    {
      say: 'اسلاید 82 اول یک آزادی بزرگ می‌دهد: شکل تابع عضویت می‌تواند *هر منحنی دلخواهی* باشد. فقط یک شرط دارد: مقدارش باید بین 0 و 1 بماند. منحنی چپ مجاز است، هرچقدر هم کج و معوج. منحنی راست جایی به 1.2 رسیده، پس تابع عضویت نیست.',
      term: ['membership function', 'تابع عضویت'],
      draw: async b => {
        await b.clear();
        const g1 = Graph({ x: 110, y: 150, w: 330, h: 230, from: 0, to: 10 });
        const g2 = Graph({ x: 570, y: 150, w: 330, h: 230, from: 0, to: 10 });
        await all([g1.axes(b, 'a1', { yTicks: [0, 1] }), g2.axes(b, 'a2', { yTicks: [0, 1] })]);
        await g1.curve(b, 'ok', x => 0.5 + 0.33 * Math.sin(x * 0.9) + 0.1 * Math.sin(x * 2.3), { color: 'green' });
        await b.write('l1', 275, 450, '✓ مجاز', { size: 30, color: 'green', bold: true, fa: true });
        await b.line('lim', g2.X(0), g2.Y(1), g2.X(10), g2.Y(1), { color: 'soft', width: 2 });
        await g2.curve(b, 'bad', x => 1.2 * Math.exp(-((x - 5) ** 2) / 4), { color: 'red' });
        await b.ring('rb', g2.X(5), g2.Y(1.2), 42, 18, { color: 'red' });
        await b.write('l2', 735, 450, `✗ ${LTR('μ = 1.2')} ← تابع عضویت نیست`, { size: 26, color: 'red', fa: true });
        await b.write('rule', 500, 515, `تنها شرط:  ${LTR('0 ≤ μ(x) ≤ 1')}`, { size: 30, color: 'orange', bold: true, fa: true });
      },
    },
    // ---------------------------------------------------------- 3. slide 82: 11 MATLAB functions
    {
      say: 'در نرم‌افزار متلب 11 نوع تابع عضویت آماده وجود دارد. همه از چند تابع پایه ساخته شده‌اند: توابع *تکه‌ای خطی*، تابع گاوسی، منحنی سیگموئید، و منحنی‌های چندجمله‌ای درجه‌ی 2 و 3. طبق قرارداد، نام همه‌شان به mf ختم می‌شود، یعنی membership function. «تکه‌ای خطی» یعنی شکل فقط از چند پاره‌خط صاف ساخته شده؛ امروز همین‌ها را می‌بینیم.',
      term: ['piecewise linear', 'تکه‌ای خطی'],
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 80, `متلب: ${LTR('11')} نوع تابع عضویت`, { size: 40, color: 'orange', bold: true, fa: true });
        const R = [['توابع تکه‌ای خطی', 'trimf, trapmf'], ['تابع گاوسی', 'gaussmf, gauss2mf'], ['منحنی سیگموئید', 'sigmf'], ['چندجمله‌ای درجه‌ی 2 و 3', 'zmf, smf, pimf']];
        for (const [k, [fa, en]] of R.entries()) {
          const y = 165 + k * 68;
          await b.write(`r${k}f`, 900, y, fa, { size: 30, anchor: 'start', fa: true, dur: 300 });
          await b.arrow(`r${k}a`, 560, y - 10, 440, y - 10, { color: 'soft', head: 10, dur: 250 });
          await b.write(`r${k}e`, 120, y, en, { size: 30, anchor: 'start', color: 'blue', dur: 300 });
        }
        await b.write('mf', 500, 460, '…mf  =  membership function', { size: 34, color: 'purple' });
        await all([b.recolor('r0f', 'orange'), b.recolor('r0e', 'orange')]);
        await b.write('today', 500, 520, 'امروز: توابع تکه‌ای خطی', { size: 24, color: 'orange', fa: true });
      },
    },
    // ---------------------------------------------------------- 4. slide 83: triangle corners
    {
      say: 'شکل 1: *مثلثی* یا Triangular، در متلب trimf. ساده‌ترین تابع عضویت است. سه نقطه‌ی a، b، c روی محور x داریم و سه گوشه‌ی مثلث این‌ها هستند: (a,0)، (b,1) و (c,0). یعنی از a بالا می‌رود، در b به قله‌ی 1 می‌رسد و تا c پایین می‌آید.',
      term: ['Triangular — trimf', 'مثلثی'],
      draw: async b => {
        await b.clear();
        const g = GL();
        await g.axes(b, 'ax', { yTicks: [0, 1] });
        await all(['a', 'b', 'c'].map((l, k) => b.write(`tk${l}`, g.X([2, 5, 8][k]), g.Y(0) + 26, l, { size: 26, color: 'purple', dur: 150 })));
        await g.poly(b, 'tri', triPts([2, 5, 8]), { color: 'blue' });
        await b.line('bd', g.X(5), g.Y(1), g.X(5), g.Y(0), { color: 'soft', width: 2 });
        await all([
          b.dot('c1', g.X(2), g.Y(0), { color: 'purple' }), b.dot('c2', g.X(5), g.Y(1), { color: 'purple' }), b.dot('c3', g.X(8), g.Y(0), { color: 'purple' }),
        ]);
        await b.write('c1t', g.X(2) - 10, g.Y(0) - 14, '(a,0)', { size: 20, color: 'purple', anchor: 'end' });
        await b.write('c2t', g.X(5), g.Y(1) - 14, '(b,1)', { size: 20, color: 'purple' });
        await b.write('c3t', g.X(8) + 10, g.Y(0) - 14, '(c,0)', { size: 20, color: 'purple', anchor: 'start' });
        await b.write('rc1', 780, 170, 'trimf', { size: 56, color: 'blue', bold: true });
        await b.write('rc2', 780, 225, 'Triangular', { size: 30, color: 'orange' });
        await b.write('rc3', 780, 270, 'مثلثی', { size: 30, fa: true });
        await b.write('rc4', 780, 340, `سه پارامتر: ${LTR('[a b c]')}`, { size: 28, fa: true });
      },
    },
    // ---------------------------------------------------------- 5. rising piece
    {
      say: 'بین a و b منحنی بالا می‌رود. فرمولش (x-a)/(b-a) است. به زبان ساده: «چقدر از a راه افتاده‌ای» تقسیم بر «کل راه از a تا قله». در x = a صورت کسر صفر است، پس μ = 0؛ در x = b صورت و مخرج برابرند، پس μ = 1.',
      draw: async b => {
        const g = GL();
        await b.erase('rc*');
        await g.poly(b, 'up', [[2, 0], [5, 1]], { color: 'orange', width: 6 });
        await b.write('lx', g.X(3.5), g.Y(0) + 26, 'x', { size: 24, color: 'blue' });
        await g.guide(b, 'gx', 3.5, 0.5);
        await b.arrow('ar1', g.X(2), 455, g.X(3.5), 455, { color: 'purple', head: 8 });
        await b.write('ar1t', (g.X(2) + g.X(3.5)) / 2, 482, 'x - a', { size: 20, color: 'purple' });
        await b.arrow('ar2', g.X(2), 505, g.X(5), 505, { color: 'purple', head: 8 });
        await b.write('ar2t', (g.X(2) + g.X(5)) / 2, 532, 'b - a', { size: 20, color: 'purple' });
        await b.write('fh', 610, 140, 'f(x; a, b, c) =', { size: 28, anchor: 'start' });
        await b.line('fbr', 625, 160, 625, 335, { color: 'purple', width: 3 });
        await b.write('f1', 645, 225, '(x - a)/(b - a)', { size: 26, color: 'orange', anchor: 'start' });
        await b.write('f1c', 955, 225, 'a ≤ x ≤ b', { size: 20, color: 'soft', anchor: 'end' });
      },
    },
    // ---------------------------------------------------------- 6. falling piece + full formula
    {
      say: 'بین b و c منحنی پایین می‌آید: (c-x)/(c-b)، یعنی «چقدر تا c مانده» تقسیم بر «کل راه از قله تا c». بیرون از بازه‌ی a تا c جواب 0 است. آکولاد بزرگ اسلاید یعنی: اول ببین x کجاست، بعد فقط فرمول همان خط را حساب کن. مرزها دو بار آمده‌اند، مثلاً x = a در دو خط هست؛ اشکالی ندارد، چون هر دو خط آنجا یک جواب می‌دهند.',
      draw: async b => {
        const g = GL();
        await b.erase(['ar*', 'gx-*', 'lx']);
        await b.dim('up', 0.35);
        await g.poly(b, 'down', [[5, 1], [8, 0]], { color: 'green', width: 6 });
        await b.write('lx', g.X(6.5), g.Y(0) + 26, 'x', { size: 24, color: 'blue' });
        await g.guide(b, 'gx', 6.5, 0.5, { color: 'green' });
        await b.arrow('ar1', g.X(8), 455, g.X(6.5), 455, { color: 'purple', head: 8 });
        await b.write('ar1t', (g.X(8) + g.X(6.5)) / 2, 482, 'c - x', { size: 20, color: 'purple' });
        await b.arrow('ar2', g.X(8), 505, g.X(5), 505, { color: 'purple', head: 8 });
        await b.write('ar2t', (g.X(8) + g.X(5)) / 2, 532, 'c - b', { size: 20, color: 'purple' });
        const rows = [['f0', '0', 'x ≤ a', 180, 'ink'], ['f2', '(c - x)/(c - b)', 'b ≤ x ≤ c', 270, 'green'], ['f3', '0', 'x ≥ c', 315, 'ink']];
        for (const [id, f, c, y, color] of rows) {
          await all([b.write(id, 645, y, f, { size: 26, color, anchor: 'start' }), b.write(id + 'c', 955, y, c, { size: 20, color: 'soft', anchor: 'end' })]);
        }
        await b.write('note', 780, 400, 'اول بازه‌ی x، بعد همان خط', { size: 24, color: 'orange', fa: true });
      },
    },
    // ---------------------------------------------------------- 7. slide 84: MATLAB example
    {
      say: 'مثال اسلاید 84 در متلب. x=0:0.1:10 یعنی x از 0 تا 10 با گام 0.1. دستور trimf(x,[3 6 8]) برای همه‌ی این xها μ را حساب می‌کند، با a = 3، b = 6، c = 8. پس شیب چپ از 3 تا 6 است، یعنی پهنای 3، و شیب راست از 6 تا 8، یعنی فقط پهنای 2.',
      draw: async b => {
        await b.clear();
        await codeBox(b, ['x=0:0.1:10;', 'y=trimf(x,[3 6 8]);', 'plot(x,y)', "xlabel('trimf, P=[3 6 8]')"]);
        const g = GR();
        await g.axes(b, 'ax', { ticks: [0, 3, 6, 8, 10] });
        await g.poly(b, 'p', triPts(T), { color: 'blue' });
        await b.write('abc', 255, 300, '[3 6 8] = [a b c]', { size: 28, color: 'blue', bold: true });
        await b.write('w1', 255, 350, `شیب چپ: ${LTR('3 → 6')}، پهنای 3`, { size: 24, color: 'orange', fa: true });
        await b.write('w2', 255, 395, `شیب راست: ${LTR('6 → 8')}، پهنای 2`, { size: 24, color: 'green', fa: true });
      },
    },
    // ---------------------------------------------------------- 8. x = 2 and x = 4.5
    {
      say: 'حالا چند نقطه را با دست حساب کنیم. x = 2: چون 2 از a = 3 کوچک‌تر است، بیرون مثلث است و μ = 0. x = 4.5: بین a و b است، پس تکه‌ی بالارونده: (4.5-3)/(6-3) = 1.5/3 = 0.5.',
      draw: async b => {
        const g = GR();
        await b.erase(['w1', 'w2']);
        await b.dot('d2', g.X(2), g.Y(0), { color: 'red', r: 7 });
        await b.write('e1', 50, 355, 'x = 2 ≤ a   →   μ = 0', { size: 24, anchor: 'start', color: 'red' });
        await g.guide(b, 'g45', 4.5, trimf(4.5, T));
        await b.write('e2', 50, 410, 'x = 4.5:  (4.5 - 3)/(6 - 3)', { size: 24, anchor: 'start' });
        await b.write('e2r', 110, 455, `= 1.5/3 = ${r(trimf(4.5, T))}`, { size: 26, anchor: 'start', color: 'green', bold: true });
      },
    },
    // ---------------------------------------------------------- 9. x = 7
    {
      say: 'x = 7: بین b و c است، پس تکه‌ی پایین‌رونده: (8-7)/(8-6) = 1/2 = 0.5. دو نقطه‌ی متفاوت، یک درجه‌ی عضویت! x = 7 فقط 1 واحد با قله فاصله دارد ولی x = 4.5 یک و نیم واحد؛ چون شیب راست تندتر است، زودتر پایین می‌آید.',
      draw: async b => {
        const g = GR();
        await g.guide(b, 'g7', 7, trimf(7, T), { color: 'green' });
        await b.write('e3', 50, 505, 'x = 7:  (8 - 7)/(8 - 6)', { size: 24, anchor: 'start' });
        await b.write('e3r', 375, 505, `= ${r(trimf(7, T))}`, { size: 26, anchor: 'start', color: 'green', bold: true });
        await b.pulse(['g45-d', 'g7-d']);
      },
    },
    // ---------------------------------------------------------- 10. compact form (MathWorks)
    {
      say: 'یک میان‌بر که در اسلاید نیست و از مستندات MathWorks است: f = max(min(L, R), 0). یعنی هر دو خط شیب‌دار را تا آخر ادامه بده، در هر x کوچک‌ترشان را بردار، و اگر منفی شد صفرش کن. min نوک مثلث را می‌سازد و max زیر محور را صاف می‌کند. برای x = 7: min(4/3, 1/2) = 0.5. برای x = 9: min(2, -0.5) = -0.5 که صفر می‌شود.',
      tip: true,
      draw: async b => {
        await b.clear();
        const g = Graph({ x: 100, y: 120, w: 440, h: 330, from: 0, to: 10, min: -0.5, max: 1.5 });
        await g.axes(b, 'ax', { ticks: [0, 10], yTicks: [-0.5, 0.5, 1, 1.5] });
        await all([b.write('ka', g.X(3) + 8, g.Y(0) + 24, 'a=3', { size: 18, color: 'soft', anchor: 'start', dur: 120 }), b.write('kb', g.X(6), g.Y(0) + 24, 'b=6', { size: 18, color: 'soft', dur: 120 }), b.write('kc', g.X(8) - 8, g.Y(0) + 24, 'c=8', { size: 18, color: 'soft', anchor: 'end', dur: 120 })]);
        await g.curve(b, 'L', x => (x - 3) / 3, { color: 'purple', lo: 1.5, hi: 7.5, steps: 2 });
        await b.write('Lt', g.X(7.5) - 14, g.Y(1.5) + 4, 'L', { size: 24, color: 'purple', anchor: 'end' });
        await g.curve(b, 'R', x => (8 - x) / 2, { color: 'purple', lo: 5, hi: 9, steps: 2 });
        await b.write('Rt', g.X(5) - 12, g.Y(1.5) + 4, 'R', { size: 24, color: 'purple', anchor: 'end' });
        await b.write('f', 780, 150, 'f = max( min( L, R ), 0 )', { size: 30, bold: true });
        await b.write('fL', 780, 200, 'L = (x - a)/(b - a)', { size: 24, color: 'purple' });
        await b.write('fR', 780, 240, 'R = (c - x)/(c - b)', { size: 24, color: 'purple' });
        await g.poly(b, 'mn', [[1.5, -0.5], [6, 1], [9, -0.5]], { color: 'orange', width: 6 });
        await b.write('e7', 780, 310, 'x = 7:  min(4/3, 1/2) = 0.5', { size: 22 });
        await b.write('e7r', 780, 350, 'max(0.5, 0) = 0.5', { size: 22, color: 'green' });
        await g.poly(b, 'fin', triPts(T), { color: 'green', width: 6 });
        await b.write('e9', 780, 410, 'x = 9:  min(2, -0.5) = -0.5', { size: 22 });
        await b.write('e9r', 780, 450, 'max(-0.5, 0) = 0', { size: 22, color: 'green' });
        await b.write('src', 780, 515, 'شکل فشرده از MathWorks است، نه اسلاید', { size: 20, color: 'soft', fa: true });
      },
    },
    // ---------------------------------------------------------- 11. moving b
    {
      say: 'حالا ببینیم هر پارامتر شکل را چطور جابه‌جا می‌کند. a و c پاهای مثلث‌اند و b نوک آن. اگر b را از 6 به 4 ببریم، قله به چپ می‌رود: شیب چپ تند و شیب راست ملایم می‌شود. اگر b را روی a بگذاریم، یعنی [3 3 8]، شیب چپ عمود می‌شود و در x = 3 یک‌باره از 0 به 1 می‌پرد.',
      draw: async b => {
        await b.clear();
        const g = Graph({ x: 110, y: 120, w: 440, h: 280, from: 0, to: 10 });
        await g.axes(b, 'ax', { ticks: [0, 3, 4, 6, 8, 10] });
        const L = [['p0', [3, 6, 8], 'soft', 'trimf [3 6 8]', ''], ['p1', [3, 4, 8], 'orange', 'trimf [3 4 8]', 'b = 4'], ['p2', [3, 3, 8], 'red', 'trimf [3 3 8]', 'b = a']];
        for (const [k, [id, p, color, label, note]] of L.entries()) {
          const y = 170 + k * 65;

        await g.guide(b, 'sc', 27, c, { color: 'blue' });
        await g.guide(b, 'sm', 27, m, { color: 'purple' });
        await b.write('s1', 800, 330, `Cold(27) = 3/20 = ${r(c)}`, { size: 22, color: 'blue' });
        await b.write('s2', 800, 375, `Medium(27) = 2/20 = ${r(m)}`, { size: 22, color: 'purple' });
        await b.write('s3', 800, 440, `min(${r(c)}, ${r(m)}) = ${r(Math.min(c, m))}`, { size: 30, color: 'green', bold: true });
      },
    },
    {
      say: 'برای trimf(x,[2 5 9]) در x = 6، کدام تکه‌ی فرمول را به کار می‌بری؟',
      draw: quizBoard(5, 'trimf(x,[2 5 9])   x = 6   →   کدام تکه؟', { fa: true }),
      quiz: {
        choices: ['(x-a)/(b-a)', '(b-x)/(b-a)', '(c-x)/(c-b)', '(x-b)/(c-b)'], correct: 2,
        hint: 'اول ببین 6 بین کدام دو گوشه است.',
        explain: '6 بین b = 5 و c = 9 است، پس شیب پایین‌رونده: (c-x)/(c-b) = (9-6)/(9-5) = 0.75.',
      },
      solve: async b => {
        const g = GQ();
        await g.axes(b, 'qa', { ticks: [0, 2, 5, 6, 9, 10] });
        await g.poly(b, 'qp', triPts([2, 5, 9]), { color: 'blue' });
        await g.poly(b, 'qd', [[5, 1], [9, 0]], { color: 'green', width: 6 });
        await g.guide(b, 'sg', 6, trimf(6, [2, 5, 9]), { color: 'green' });
        await b.write('s1', 780, 260, `${LTR('5 ≤ 6 ≤ 9')} ← پایین‌رونده`, { size: 24, color: 'orange', fa: true });
        await b.write('s2', 780, 320, '(c - x)/(c - b)', { size: 30, color: 'green', bold: true });
        await b.write('s3', 780, 380, `(9 - 6)/(9 - 5) = ${r(trimf(6, [2, 5, 9]))}`, { size: 26 });
      },
    },
    {
      say: 'سؤال آخر: ذوزنقه‌ی trapmf(x,[a b c d]) در چه حالتی دقیقاً همان مثلث است؟',
      draw: quizBoard(6, 'trapmf(x,[a b c d]) = مثلث وقتی …', { fa: true }),
      quiz: {
        choices: ['a = b', 'c = d', 'b = c', 'a = d'], correct: 2,
        hint: 'سقف صاف ذوزنقه بین کدام دو گوشه است؟',
        explain: 'سقف صاف بین b و c است. اگر b = c باشد سقف به یک نقطه جمع می‌شود و ذوزنقه مثلث می‌شود. a = b فقط شانه‌ی چپ می‌سازد.',
      },
      solve: async b => {
        const g = GQ();
        await g.axes(b, 'qa', { ticks: [0, 1, 5, 8, 10], yTicks: [0, 1] });
        await g.poly(b, 'q0', trapPts([1, 4, 6, 8]), { color: 'soft' });
        await g.poly(b, 'q1', trapPts([1, 5, 5, 8]), { color: 'green', width: 5 });
        await b.write('s1', 780, 280, 'b = c', { size: 40, color: 'green', bold: true });
        await b.write('s2', 780, 340, 'سقف صاف ← یک نقطه', { size: 26, color: 'orange', fa: true });
        await b.write('s3', 780, 400, 'trapmf [1 5 5 8] = trimf [1 5 8]', { size: 20 });
      },
    },
  ],
});
