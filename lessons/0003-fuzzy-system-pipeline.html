// The air conditioner of slides 35–36, with the lesson's own membership functions.
const cold = t => Math.max(0, Math.min(1, (18 - t) / 8));          // 1 up to 10, 0 from 18
const cool = t => Math.max(0, Math.min((t - 10) / 8, (26 - t) / 8)); // 10 / 18 / 26
const warm = t => Math.max(0, Math.min(1, (t - 18) / 8));          // 0 up to 18, 1 from 26
const humid = h => Math.max(0, Math.min(1, (h - 40) / 40));        // 0 at 40 %, 1 at 80 %
const REP = { off: 0, low: 40, high: 100 };                         // representative air flow (%)
function ac(T, H) {
  const w1 = warm(T), w2 = cool(T), w3 = Math.min(cold(T), humid(H));
  const y = (REP.high * w1 + REP.off * w2 + REP.low * w3) / (w1 + w2 + w3);
  return { cold: cold(T), cool: cool(T), warm: warm(T), humid: humid(H), w1, w2, w3, y };
}
const R14 = ac(14, 70), R12 = ac(12, 60);

  if (fa) await b.write(`${id}-fa`, x + w / 2, y + h / 2 + (en ? 30 : 8), fa, { size: 22, fa: true, dur: 250 });
}

}

      say: 'ادامه‌ی همان: برای T = 12 و H = 60 داریم w1 = 0، w2 = 0.25 و w3 = 0.5. با عددهای نماینده‌ی خاموش 0، کم 40، زیاد 100، سرعت هوا چند درصد است؟ تا یک رقم اعشار بنویسید.',
      draw: quizBoard(3, 'w1 = 0 ,  w2 = 0.25 ,  w3 = 0.5   →   y = ? %', { size: 34 }, 'off = 0   ·   low = 40   ·   high = 100'),

    },
    {

      quiz: {
        choices: [

          'defuzzification → inference → composition → fuzzification',
        ], correct: 1,
        explain: 'تا عدد ورودی فازی نشده، قاعده‌ها را نمی‌شود سنجید؛ تا قاعده‌ها سنجیده نشده‌اند، چیزی برای ترکیب نیست؛ و برگرداندن به عدد همیشه آخر است.',

      solve: async b => {

          await b.write(`so${k}`, 160 + k * 230, 300, `${LTR(String(k + 1))}. ${s}`, { size: 30, color: 'green', fa: true });

    },
    {
      say: 'در کدام نوع سیستم فازی، بخش «آنگاه» قاعده یک فرمول ریاضی مثل y = c·x است؟',
      draw: quizBoard(5, 'THEN y = c·x  →  ?', { size: 48 }),
      quiz: {
        choices: ['pure fuzzy system', 'TSK fuzzy system', 'with fuzzifier and defuzzifier', 'classical crisp system'], correct: 1,
        explain: 'در سیستم TSK (تاکاگی–سوگنو–کانگ) بخش «آنگاه» یک فرمول ساده است، مثل y = c·x. برای همین ورودی و خروجی‌اش عدد است، ولی جایی برای دانش بشری ندارد و انعطاف ندارد.',
      },
      solve: async b => {
        await b.write('s1', 500, 280, 'TSK: IF x … THEN y = c·x', { size: 40, color: 'green', bold: true });

      },
    },
    {
      say: 'سؤال آخر: مشکل اصلی سیستم فازی *خالص* چیست؟',

      quiz: {
        choices: ['ورودی و خروجی‌اش مجموعه‌ی فازی است', 'بخش آنگاه آن یک فرمول ریاضی است', 'قواعدش از افراد خبره گرفته نمی‌شود', 'خروجی‌اش همیشه یک عدد حقیقی است'], correct: 0,
        explain: 'ورودی و خروجی سیستم فازی خالص مجموعه‌ی فازی است، ولی سیستم‌های مهندسی عدد حقیقی می‌گیرند و می‌دهند. «فرمول در آنگاه» مشکل TSK است.',
      },
      solve: async b => {
        await b.write('s1', 500, 270, 'خالص: مجموعه‌ی فازی ← مجموعه‌ی فازی', { size: 34, color: 'red', fa: true });
