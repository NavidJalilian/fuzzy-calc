// Lesson 1 — slides 7–22 (Part 1: what fuzzy logic is).
// Explanations are Persian; numbers, math and technical terms stay in English.

const fmt = n => String(+n.toFixed(4));
const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (numbers, math) intact inside Persian board text

// The lesson's own "tall" membership function (cm): 0 up to 160, straight line up to 1 at 185.
const tall = h => Math.min(1, Math.max(0, (h - 160) / 25));
const crispTall = h => (h >= 180 ? 1 : 0);
// Height graph shared by several steps.
const G = () => Graph({ x: 150, y: 110, w: 600, h: 270, from: 140, to: 210 });

function quizBoard(n, question, o = { size: 44 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 140, question, o);
  };
}

// Quiz solution for μ_tall(h): which piece of the formula, then the value.
async function solveTall(b, h) {
  await b.write('s1', 500, 220, 'μ_tall(h) = (h − 160) / 25    (160 ≤ h ≤ 185)', { size: 30, color: 'blue' });
  await b.write('s2', 500, 270, '0 if h ≤ 160        1 if h ≥ 185', { size: 26, color: 'soft' });
  await b.write('s3', 500, 350, `μ_tall(${h}) = (${h} − 160) / 25 = ${h - 160} / 25`, { size: 34 });
  await b.write('s4', 500, 430, `= ${fmt(tall(h))}`, { size: 50, color: 'green', bold: true });
  await b.write('s5', 500, 500, `قطعی (مرز ${LTR('180')}): ${LTR(String(crispTall(h)))}`, { size: 26, color: 'soft', fa: true });
}
