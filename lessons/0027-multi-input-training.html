// One full training step of a linear neuron y_p = w·x + b with MSE loss.
function step(X, Y, w, b, eta) {
  const n = X.length;
  const yp = X.map(x => x.reduce((s, v, j) => s + v * w[j], 0) + b);
  const err = yp.map((p, i) => p - Y[i]);
  const e = err.reduce((s, d) => s + d * d, 0) / n;
  const gw = w.map((_, j) => (2 / n) * X.reduce((s, x, i) => s + x[j] * err[i], 0));
  const gb = (2 / n) * err.reduce((s, d) => s + d, 0);
  return { yp, err, e, gw, gb, w2: w.map((v, j) => v - eta * gw[j]), b2: b - eta * gb };
}

// Worked example (teacher's own): two samples, two inputs.
const EX = { X: [[1, 2], [2, 1]], Y: [5, 4], w: [1, 1], b: 0, eta: 0.1 };
const S1 = step(EX.X, EX.Y, EX.w, EX.b, EX.eta);
const S2 = step(EX.X, EX.Y, S1.w2, S1.b2, EX.eta);

        await b.write('ck2', 830, 250, `${r2(S1.e)} → ${r2(S2.e)}`, { size: 30, color: 'green', bold: true });

    },

      quiz: { answer: ['4'], hint: 'هر ورودی یک وزن، به‌علاوه‌ی یک bias.', explain: 'p = [w_1, w_2, w_3, b]: سه وزن و یک bias، یعنی 4 پارامتر.' },

      quiz: {
        choices: ['تعداد ورودی‌های نورون', 'تعداد تکرارهای حلقه‌ی آموزش', 'تعداد نمونه‌های داده'], correct: 1,
        explain: 'هر دور حلقه یک بار همه‌ی پارامترها را آپدیت می‌کند؛ N می‌گوید چند دور این کار تکرار شود. تعداد نمونه‌ها n است که در میانگین Σ می‌آید.',
