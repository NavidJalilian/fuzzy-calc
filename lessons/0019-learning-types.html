// Lesson 19 — slides 168–185 (part 6: machine learning). Supervised, unsupervised, semi-supervised, reinforcement.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const FA = /[؀-ۿ]/;

async function node(b, id, x, y, w, h, label, o = {}) {
  await b.box(id, x, y, w, h, { color: o.color || 'blue', fill: o.fill ?? (o.color || 'blue'), dur: o.dur ?? 350 });
  const size = o.size || 24;
  await b.write(id + '-t', x + w / 2, y + h / 2 + size / 3, label, { size, fa: FA.test(label), color: o.text || 'ink', bold: o.bold, dur: 250 });
}

function quizBoard(n, question, o = { size: 30, fa: true }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 140, question, o);
  };
}

// ---- the student scatter of slides 173–180 (read off the slide picture, scaled to 0..1)
// x = how much they studied, y = how much they rested.
const FAILED = [[0.099, 0.359], [0.171, 0.395], [0.271, 0.421], [0.39, 0.364], [0.171, 0.303], [0.264, 0.272], [0.39, 0.226], [0.473, 0.19], [0.154, 0.159], [0.271, 0.133], [0.39, 0.103], [0.545, 0.108]];
const PASSED = [[0.455, 0.887], [0.613, 0.877], [0.736, 0.862], [0.521, 0.769], [0.599, 0.759], [0.692, 0.759], [0.51, 0.662], [0.61, 0.667], [0.716, 0.641], [0.791, 0.687], [0.647, 0.554], [0.726, 0.595]];
const P = { x0: 110, y0: 460, w: 400, h: 330 };          // plot: origin bottom-left
const SX = u => P.x0 + 25 + u * (P.w - 50);
const SY = v => P.y0 - 20 - v * (P.h - 45);
const BOUND = u => 0.95 - (u - 0.15) * 0.9375;            // the straight decision boundary (slide 174)

async function plotAxes(b, id) {
  await all([
    b.arrow(`${id}-x`, P.x0, P.y0, P.x0 + P.w, P.y0, { color: 'soft', head: 10 }),
    b.arrow(`${id}-y`, P.x0, P.y0, P.x0, P.y0 - P.h, { color: 'soft', head: 10 }),
  ]);
  await all([
    b.write(`${id}-xl`, P.x0 + P.w - 70, P.y0 + 35, 'میزان مطالعه', { size: 22, color: 'soft', fa: true }),
    b.write(`${id}-yl`, P.x0 + 80, P.y0 - P.h + 5, 'میزان استراحت', { size: 22, color: 'soft', fa: true }),
  ]);
}
// labeled = true: failed = blue dots, passed = red squares. false: every student is a plain dot.
function students(b, id, labeled) {
  return all([
    ...FAILED.map(([u, v], k) => b.dot(`${id}-f${k}`, SX(u), SY(v), { color: labeled ? 'blue' : 'ink', r: 9 })),
    ...PASSED.map(([u, v], k) => (labeled
      ? b.box(`${id}-p${k}`, SX(u) - 8, SY(v) - 8, 16, 16, { color: 'red', fill: 'red', r: 2, dur: 150 })
      : b.dot(`${id}-p${k}`, SX(u), SY(v), { color: 'ink', r: 9 }))),
  ]);
}

// ---- house prices (slides 175–176): price grows with area and levels off.
const price = a => 10 * (1 - Math.exp(-0.33 * a));
const HOUSES = [[0.8, -0.7], [1.3, 0.6], [1.8, 0.9], [2.6, -1.1], [3.0, 0.6], [3.6, 0.4], [4.4, -0.3], [5.2, 0.5], [6.3, -0.6], [7.2, 0.3], [8.1, -0.4]].map(([a, d]) => [a, price(a) + d]);
const G = Graph({ x: 120, y: 120, w: 380, h: 310, from: 0, to: 10, min: 0, max: 10 });

// ---- semi-supervised cloud (slide 183): two blobs, a few labeled points, the rest unlabeled.
function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }; }
const CLOUD = (() => {
  const r = rng(7), pts = [];
  for (let k = 0; k < 34; k++) pts.push([0.08 + 0.42 * r(), 0.08 + 0.42 * r(), 0]);
  for (let k = 0; k < 30; k++) pts.push([0.5 + 0.42 * r(), 0.5 + 0.42 * r(), 1]);
  return pts;
})();
const SEEDS = [[0.2, 0.3, 0], [0.38, 0.15, 0], [0.12, 0.45, 0], [0.7, 0.75, 1], [0.85, 0.6, 1], [0.6, 0.88, 1]]; // labeled ones
const nearest = ([u, v]) => SEEDS.reduce((best, s) => ((s[0] - u) ** 2 + (s[1] - v) ** 2 < (best[0] - u) ** 2 + (best[1] - v) ** 2 ? s : best))[2];
