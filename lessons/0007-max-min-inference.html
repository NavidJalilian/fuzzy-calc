// Lesson 7 — slides 69–76 (Part 2: fuzzy operations and inference).
// Explanations are Persian; numbers, math and technical terms stay in English.
// Every matrix cell and every max-min result below is computed in code, not typed by hand.

const f = v => String(+v.toFixed(4));
const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text

// ------------------------------------------------------------------ A ∘ M boards
// A is written as a column beside M, so a_i sits next to row i of M.
function AM(n, p) {
  const RY = Array.from({ length: n }, (_, i) => 180 + i * 62);
  const MX = Array.from({ length: p }, (_, j) => 410 + j * 105);
  const bot = RY[n - 1] + 22;
  return { RY, MX, AX: 255, top: RY[0] - 40, bot, BL: bot + 40, BY: bot + 85, MXL: bot + 135 };
}
function bracket(b, id, x, top, bot, side) {
  const t = side === 'left' ? 12 : -12;
  return b.wire(id, [[x + t, top], [x, top], [x, bot], [x + t, bot]], { color: 'soft', dur: 250 });
}
// Draws A (column), M (matrix) and an empty answer row B = ( ? ? ? ).
async function drawAM(b, A, M, o = {}) {
  const Ly = AM(A.length, M[0].length);
  const { RY, MX, AX, top, bot } = Ly;
  await all([
    b.write('an', AX, 80, o.aName ?? 'A', { size: 32, color: 'purple', bold: true }),
    b.write('mname', (MX[0] + MX[MX.length - 1]) / 2, 80, o.mName ?? 'M', { size: 32, bold: true }),
    bracket(b, 'abl', AX - 38, top, bot, 'left'), bracket(b, 'abr', AX + 38, top, bot, 'right'),
    bracket(b, 'mbl', MX[0] - 55, top, bot, 'left'), bracket(b, 'mbr', MX[MX.length - 1] + 55, top, bot, 'right'),
    b.write('circ', (AX + MX[0] - 55 + 38) / 2, (top + bot) / 2 + 12, '∘', { size: 40 }),
  ]);
  if (o.cols) await all(o.cols.map((c, j) => b.write(`ch-${j}`, MX[j], 118, c, { size: 20, color: 'soft', dur: 150 })));
  for (const [i, a] of A.entries()) {
    await all([
      b.write(`a-${i}`, AX, RY[i], f(a), { size: 30, color: 'purple', dur: 200 }),
      ...M[i].map((m, j) => b.write(`m-${i}-${j}`, MX[j], RY[i], f(m), { size: 30, dur: 200 })),
    ]);
  }
  const bn = o.bName ?? 'b';
  await b.write('bn', AX, Ly.BY, `${o.bName === 'b′' ? 'B′' : 'B'} =`, { size: 30, bold: true });
  await all(MX.map((x, j) => all([
    b.write(`bl-${j}`, x, Ly.BL, `${bn}_${j + 1}`, { size: 22, color: 'soft', dur: 150 }),
    b.write(`bv-${j}`, x, Ly.BY, '?', { size: 32, color: 'soft', dur: 150 }),
  ])));
  return Ly;
}
// Column j: pair each a_i with m_ij and keep the smaller one.
async function colMins(b, A, M, j) {
  const Ly = AM(A.length, M[0].length);
  await b.erase(['cb', 'mn-*', 'mr-*', 'win-*', 'mx']);
  await all([
    b.box('cb', Ly.MX[j] - 46, Ly.top + 2, 92, Ly.bot - Ly.top - 4, { color: 'orange' }),
    b.write('mh', 800, 118, 'min', { size: 24, color: 'soft' }),
  ]);
  for (const [i, a] of A.entries()) {
    const m = M[i][j];
    await all([
      b.pulse([`a-${i}`, `m-${i}-${j}`], 450),
      b.write(`mn-${i}`, 850, Ly.RY[i], `min(${f(a)}, ${f(m)}) =`, { size: 22, anchor: 'end', dur: 350 }),
    ]);
    await b.write(`mr-${i}`, 905, Ly.RY[i], f(Math.min(a, m)), { size: 28, color: 'blue', dur: 200 });
  }
}
// Then the biggest of those mins is b_j.
async function colMax(b, A, M, j, bn = 'b') {
  const Ly = AM(A.length, M[0].length);
  const mins = A.map((a, i) => Math.min(a, M[i][j]));
  const best = Math.max(...mins);
  await all(mins.map((v, i) => (v === best ? b.ring(`win-${i}`, 905, Ly.RY[i] - 9, 34, 22, { color: 'green' }) : null)));
  await b.write('mx', 500, Ly.MXL, `${bn}_${j + 1} = max{${mins.map(f).join(', ')}} = ${f(best)}`, { size: 24, color: 'green' });
  await b.write(`bv-${j}`, Ly.MX[j], Ly.BY, f(best), { size: 32, color: 'green', bold: true });
}
const compose = (A, M) => M[0].map((_, j) => Math.max(...A.map((a, i) => Math.min(a, M[i][j]))));

// ------------------------------------------------------------------ slide 72 data
const A72 = [0.2, 0.4, 0.6, 1];
const M72 = [[0.1, 0.6, 0.8], [0.6, 0.8, 0.6], [0.8, 0.6, 0.5], [0.0, 0.5, 0.5]];

// ------------------------------------------------------------------ slide 74–75: the rule matrix
const T = [100, 125, 150, 175, 200], TA = [0, 0.5, 1, 0.5, 0];   // Normal temperature (A)
const V = [10, 20, 30, 40, 50], VB = [0, 0.6, 1, 0.6, 0];         // Medium velocity (B)
const MU = TA.map(a => VB.map(v => Math.min(a, v)));
const RG = { CX: [390, 490, 590, 690, 790], RY: [212, 268, 324, 380, 436], XV: 165, XA: 250, HY: 110, HB: 148, L: 340, R: 840, top: 180, bot: 452 };

async function ruleFrame(b) {
  await b.write('rt', 500, 56, 'If temperature is Normal then speed is Medium', { size: 24, color: 'blue' });
  await all([
    b.write('hx', RG.XV, RG.HB, 'x', { size: 22, color: 'soft' }),
    b.write('ha', RG.XA, RG.HB, 'a_i', { size: 22, color: 'purple' }),
    b.write('hy', 315, RG.HY, 'y', { size: 22, color: 'soft' }),
    b.write('hb', 315, RG.HB, 'b_j', { size: 22, color: 'orange' }),
  ]);
  await all(V.map((v, j) => all([
    b.write(`sv-${j}`, RG.CX[j], RG.HY, String(v), { size: 26, dur: 200 }),
    b.write(`sb-${j}`, RG.CX[j], RG.HB, f(VB[j]), { size: 24, color: 'orange', dur: 200 }),
  ])));
  await all(T.map((t, i) => all([
    b.write(`tv-${i}`, RG.XV, RG.RY[i], String(t), { size: 26, dur: 200 }),
    b.write(`ta-${i}`, RG.XA, RG.RY[i], f(TA[i]), { size: 26, color: 'purple', dur: 200 }),
  ])));
  await all([
    bracket(b, 'rbl', RG.L, RG.top, RG.bot, 'left'), bracket(b, 'rbr', RG.R, RG.top, RG.bot, 'right'),
  ]);
  await all(T.flatMap((_, i) => V.map((__, j) => b.write(`r-${i}-${j}`, RG.CX[j], RG.RY[i], '?', { size: 22, color: 'soft', dur: 100 }))));
}
const rowBox = (b, i) => b.box('rb', RG.L + 6, RG.RY[i] - 34, RG.R - RG.L - 12, 46, { color: 'orange' });
async function fillRow(b, i, color = 'blue', show = true) {
  for (let j = 0; j < 5; j++) {
    if (show) {
      await all([
        b.pulse([`ta-${i}`, `sb-${j}`], 350),
        b.write('calc', 500, 515, `m = min(${f(TA[i])}, ${f(VB[j])}) = ${f(MU[i][j])}`, { size: 26, dur: 250 }),
      ]);
    }
    await b.write(`r-${i}-${j}`, RG.CX[j], RG.RY[i], f(MU[i][j]), { size: 26, color, dur: 200 });
  }
}

// ------------------------------------------------------------------ quiz data
const QA1 = [0.3, 0.9, 0.5];
const QM1 = [[0.7, 0.2, 0.4], [0.1, 0.6, 0.8], [0.5, 1.0, 0.3]];
const QA3 = [0.4, 1, 0.7], QB3 = [0.5, 1, 0.2];
const QR3 = QA3.map(a => QB3.map(v => Math.min(a, v)));
const NOT3 = QA3.map(a => +(1 - a).toFixed(4));

function quizHead(b, n) {
  return b.write('q-n', 500, 45, `سؤال ${n} از 6`, { size: 22, color: 'soft', fa: true });
}
function quizBoard(n, question, o = { size: 50 }) {
  return async b => {
    await b.clear();
    await quizHead(b, n);
    await b.write('q-q', 500, 160, question, o);
  };
}

        await b.write('q', 820, 80, 'A′ = ¬A ,  b′_1 = ?', { size: 28, color: 'orange', bold: true });
      },
      quiz: { answer: ['0.4'], hint: 'مکمل: هر عدد A را از 1 کم کن. بعد با ستون اول R، max-min بگیر.', explain: 'A′ = [0.6 0 0.3]. minها با ستون اول R: 0.4، 0 و 0.3؛ بزرگ‌ترین 0.4.' },
      solve: async b => {
        await b.erase('q');
        await b.write('an', AM(3, 3).AX, 80, 'A′ = 1 − A', { size: 28, color: 'orange', bold: true });
        for (const [i, a] of NOT3.entries()) await b.write(`a-${i}`, AM(3, 3).AX, AM(3, 3).RY[i], f(a), { size: 30, color: 'orange', dur: 300 });
        await colMins(b, NOT3, QR3, 0);
        await colMax(b, NOT3, QR3, 0, 'b′');
      },
    },
    {
      say: 'سؤال آخر: فرض کنید ورودی دقیقاً خود A باشد (A′ = A) و A دست‌کم یک عضویت برابر 1 داشته باشد، مثل A سؤال 3. حاصل A ∘ R چیست؟',
      draw: quizBoard(6, `اگر ${LTR('A′ = A')} و یکی از عضویت‌های A برابر 1 باشد:  ${LTR('A ∘ R = ?')}`, { size: 30, fa: true }),
      quiz: {
        choices: ['B′ = A', 'B′ = 0', 'B′ = 1', 'B′ = B'], correct: 3,
        hint: 'سطری از R که درجه‌اش 1 است چه شکلی دارد؟',
        explain: 'سطر با درجه‌ی 1 خودِ B است و هیچ سطر دیگری از B بلندتر نیست؛ پس max روی ستون‌ها دقیقاً B را برمی‌گرداند. اینجا: (0.5, 1, 0.2) = B.',
      },
      solve: async b => {
        await b.erase('q-q');
        await drawAM(b, QA3, QR3, { mName: 'R', bName: 'b′', cols: ['y=10', 'y=20', 'y=30'] });
        for (let j = 0; j < 3; j++) { await colMins(b, QA3, QR3, j); await colMax(b, QA3, QR3, j, 'b′'); }
        await b.erase('cb');
        await b.write('eqB', 860, AM(3, 3).BY, '= B  ✓', { size: 32, color: 'green', bold: true });
      },
    },
  ],
});
</script>
