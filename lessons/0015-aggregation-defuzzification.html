// Lesson 15 — slides 116–121 (part 4: fuzzy reasoning and inference systems).
// Stage 4 (aggregation with max) and stage 5 (defuzzification: centroid, bisector, MOM, SOM, LOM).
// Explanations are Persian; numbers, math and technical terms stay in English.

const fmt = (n, d = 2) => String(+n.toFixed(d));
const all = list => Promise.all(list);
const LTR = s => s; // the player now keeps English / number runs in order inside Persian text by itself

// ---- the slide-117 rain example with lesson 14's shapes (the slide draws the sets without numbers)
const tri = (a, m, c) => z => Math.max(0, Math.min((z - a) / (m - a), (c - z) / (c - m)));
const C1 = tri(5, 7, 9);    // بارش زیاد
const C2 = tri(2, 4, 6);    // بارش کم
const AL1 = 0.3, AL2 = 0.2; // α_1, α_2 from slides 113–117
const C1c = z => Math.min(AL1, C1(z));
const C2c = z => Math.min(AL2, C2(z));
const AGG = z => Math.max(C1c(z), C2c(z));
const ZS = Array.from({ length: 11 }, (_, k) => k);
const AGG_PTS = [[0, 0], [2, 0], [2.4, 0.2], [5.4, 0.2], [5.6, 0.3], [8.4, 0.3], [9, 0], [10, 0]];
const NUM = ZS.reduce((s, z) => s + z * AGG(z), 0);   // 8.7
const DEN = ZS.reduce((s, z) => s + AGG(z), 0);       // 1.5
const ZC = NUM / DEN;                                 // 5.8 (whole-number z only)
// continuous centroid (same as lesson 14): ∫ z·μ dz / ∫ μ dz = 52/9 ≈ 5.78
const ZCC = (() => { let m = 0, a = 0; for (let z = 0.0005; z < 10; z += 0.001) { m += z * AGG(z); a += AGG(z); } return m / a; })();

// ---- slide 121: trapmf(x, [-10 -8 -4 7])
const TRAP = [[-10, 0], [-8, 1], [-4, 1], [7, 0]];
const T_AREA = [1, 4, 5.5];                 // left triangle, rectangle, right triangle
const T_CX = [-10 + 2 * 2 / 3, -6, -4 + 11 / 3];
const T_MOM = T_AREA.reduce((s, a, k) => s + a * T_CX[k], 0); // -34.5
const T_C = T_MOM / 10.5;                                       // -3.2857
const T_B = -4 + (11 - Math.sqrt(121 - 22 * 0.25));            // -3.747 (continuous bisector)

const G = Graph({ x: 130, y: 110, w: 650, h: 360, from: 0, to: 10 });
const GT = Graph({ x: 120, y: 130, w: 700, h: 300, from: -10, to: 10 });

async function rainAxes(b) {
  await G.axes(b, 'ax', { ticks: ZS, yTicks: [0.2, 0.3, 1], label: 'z' });
}
async function trapAxes(b) {
  await GT.axes(b, 'tx', { ticks: [-10, -8, -6, -4, 0, 4, 7, 10], yTicks: [0.5, 1], label: 'x' });
  await GT.poly(b, 'trap', TRAP, { color: 'blue' });
  await b.write('trapl', GT.X(6.5), GT.Y(0.3), 'mf', { size: 24, color: 'blue' });
}

function quizBoard(n, question, o = { size: 40 }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 130, question, o);
  };
}

    {
      say: 'یک مجموعه‌ی ذوزنقه‌ای trapmf با نقطه‌های [1 3 7 8] داریم. خروجی mom چند است؟',
      draw: quizBoard(3, 'trapmf(x, [1 3 7 8])    mom = ?', { size: 40 }),
      quiz: { answer: ['5'], hint: 'عضویت از 3 تا 7 برابر 1 (ماکزیمم) است. وسط این بازه کجاست؟', explain: 'ماکزیمم روی بازه‌ی 3 تا 7 است؛ MOM = (3 + 7) / 2 = 5' },
      solve: async b => {
        const g = Graph({ x: 200, y: 230, w: 600, h: 200, from: 0, to: 10 });
        await g.axes(b, 'qa', { ticks: [0, 1, 3, 5, 7, 8, 10], yTicks: [1] });
        await g.poly(b, 'qt', [[0, 0], [1, 0], [3, 1], [7, 1], [8, 0], [10, 0]], { color: 'blue' });
        await b.line('qp', g.X(3), g.Y(1), g.X(7), g.Y(1), { color: 'orange' });
        for (const [k, [n, v]] of [['SOM', 3], ['MOM', 5], ['LOM', 7]].entries()) {
          await b.dot(`qd${k}`, g.X(v), g.Y(1), { color: 'purple', r: 7 });
          await b.write(`qn${k}`, g.X(v), g.Y(1) + 34, n, { size: 22, color: 'purple', bold: true });
        }
        await b.write('qr', 500, 520, 'MOM = (3 + 7) / 2 = 5', { size: 36, color: 'green', bold: true });
      },
    },
    {
      say: 'کدام روش غیرفازی‌سازی نقطه‌ای را می‌دهد که مساحت زیر نمودار را به دو نیمه‌ی مساوی تقسیم می‌کند؟',
      draw: quizBoard(4, 'کدام روش مساحت را نصف می‌کند؟', { size: 40, fa: true }),
      quiz: { choices: ['centroid', 'bisector', 'mom', 'lom'], correct: 1, explain: 'bisector یعنی نیمساز: خط عمودی‌ای که دو طرفش مساحت برابر دارد. centroid نقطه‌ی تعادل است، که در شکل کج با آن فرق می‌کند.' },
      solve: async b => {
        const g = Graph({ x: 200, y: 230, w: 600, h: 200, from: -10, to: 10 });
        await g.axes(b, 'qa', { ticks: [-10, -4, 7], yTicks: [1] });
        await g.poly(b, 'qt', TRAP, { color: 'blue' });
        await b.line('qb', g.X(T_B), g.Y(0), g.X(T_B), g.Y(1), { color: 'purple' });
        await b.write('ql', g.X(-7), g.Y(0.4), '5.25', { size: 26, color: 'purple', bold: true });
        await b.write('qr', g.X(-1), g.Y(0.25), '5.25', { size: 26, color: 'purple', bold: true });
        await b.write('qt2', 500, 510, 'bisector: دو طرف خط، مساحت برابر', { size: 28, color: 'green', fa: true });
      },
    },
    {
      say: 'تجمیع دقیقاً کجای سیستم استنتاج فازی انجام می‌شود؟',
      draw: quizBoard(5, 'تجمیع کِی انجام می‌شود؟', { size: 42, fa: true }),
      quiz: {
        choices: ['برای هر قاعده جداگانه، قبل از استلزام', 'برای هر متغیر خروجی فقط یک بار، درست قبل از غیرفازی‌سازی', 'قبل از فازی‌سازی ورودی‌ها'],
        correct: 1,
        explain: 'اسلاید 116: تجمیع برای هر متغیر خروجی فقط یک بار و درست قبل از مرحله‌ی نهایی، یعنی غیرفازی‌سازی، انجام می‌شود.',
      },
      solve: async b => {
        const S = ['فازی‌سازی', 'عملگر', 'استلزام', 'تجمیع', 'غیرفازی‌سازی'];
        for (const [k, s] of S.entries()) {
          const x = 800 - k * 175;
          await b.box(`qb${k}`, x - 75, 250, 150, 70, { color: k === 3 ? 'orange' : 'soft', dur: 200 });
          await b.write(`qs${k}`, x, 295, s, { size: 20, fa: true, bold: k === 3, dur: 150 });
        }
        await b.write('qn', 450, 390, 'یک بار، درست قبل از آخر', { size: 30, color: 'green', fa: true });
      },
    },
    {
      say: 'سؤال آخر، از اسلاید 121: برای trapmf(x, [-10 -8 -4 7])، جواب روش lom کدام است؟',
      draw: quizBoard(6, "defuzz(x, trapmf(x, [-10 -8 -4 7]), 'lom') = ?", { size: 34 }),
      quiz: { choices: ['-8', '-6', '-4', '-3.29'], correct: 2, explain: 'ماکزیمم (عضویت 1) روی بازه‌ی -8 تا -4 است. lom بزرگ‌ترین نقطه‌ی این بازه است: -4. (‎-8 جواب som، ‎-6 جواب mom و ‎-3.29 جواب centroid است.)' },
      solve: async b => {
        const g = Graph({ x: 200, y: 230, w: 600, h: 200, from: -10, to: 10 });
        await g.axes(b, 'qa', { ticks: [-10, -8, -4, 7], yTicks: [1] });
        await g.poly(b, 'qt', TRAP, { color: 'blue' });
        await b.line('qp', g.X(-8), g.Y(1), g.X(-4), g.Y(1), { color: 'orange' });
        await b.dot('qd', g.X(-4), g.Y(1), { color: 'green', r: 8 });
        await b.write('qr', 500, 520, 'LOM = -4', { size: 40, color: 'green', bold: true });
      },
    },
  ],
});
