// Lesson 13 — slides 102–107 (part 4: fuzzy reasoning with fuzzy inputs, several rules).
// Explanations are Persian; numbers, math and technical terms stay in English.

const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const all = list => Promise.all(list);
const fmt = n => String(+n.toFixed(4));

// Membership-function shapes.
const tri = (a, m, c) => v => Math.max(0, Math.min((v - a) / (m - a), (c - v) / (c - m)));
const trap = (a, p, q, d) => v => Math.max(0, Math.min(1, (v - a) / (p - a), (d - v) / (d - q)));
const bell = (c, s) => v => Math.exp(-((v - c) ** 2) / (2 * s * s));
const AND = (f, g) => v => Math.min(f(v), g(v));
const OR = (f, g) => v => Math.max(f(v), g(v));

// Highest point of min(f, g) on [lo, hi] → [v, μ]. This is max over x of (f ∧ g).
function peak(f, g, lo, hi) {
  const h = v => Math.min(f(v), g(v)), n = 4000, step = (hi - lo) / n;
  let best = lo;
  for (let k = 0; k <= n; k++) { const v = lo + step * k; if (h(v) > h(best) + 1e-12) best = v; }
  let a = Math.max(lo, best - step), c = Math.min(hi, best + step);   // refine: min(f, g) is single-peaked here
  for (let k = 0; k < 80; k++) {
    const m1 = a + (c - a) / 3, m2 = c - (c - a) / 3;
    if (h(m1) < h(m2)) a = m1; else c = m2;
  }
  const v = (a + c) / 2;
  return h(v) >= h(best) ? [v, h(v)] : [best, h(best)];
}

// A filled region under μ = f(v) between lo and hi.
function shade(b, g, id, f, lo, hi, color = 'green', dur = 700) {
  const pts = [[lo, 0]];
  for (let k = 0; k <= 100; k++) { const v = lo + ((hi - lo) * k) / 100; pts.push([v, f(v)]); }
  pts.push([hi, 0]);
  const d = 'M' + pts.map(([v, m]) => `${g.X(v).toFixed(1)} ${g.Y(m).toFixed(1)}`).join('L') + 'Z';
  return b.path(id, d, { color, fill: color, width: 2.5, dur });
}

// Persian label on the right, formal English line starting at x = 200.
async function row(b, id, y, fa, en, color = 'ink', size = 28) {
  await b.write(`${id}-fa`, 840, y, fa, { size: size - 2, color: 'purple', bold: true, fa: true });
  await b.write(`${id}-en`, 200, y, en, { size, color, anchor: 'start' });
}

// ---- case 1 picture (slide 102): bell-shaped A and A′, trapezoid B
const C1A = bell(4, 1.1), C1A2 = bell(6.4, 0.9), C1B = trap(2, 3.5, 6.5, 8);
const C1P = peak(C1A, C1A2, 0, 10);                       // crossing point and α
const G1A = Graph({ x: 100, y: 320, w: 330, h: 150, from: 0, to: 10 });
const G1B = Graph({ x: 560, y: 320, w: 330, h: 150, from: 0, to: 10 });

// ---- our numeric example: triangles A = (0, 4, 8), A′ = (4, 8, 12)
const NA = tri(0, 4, 8), NA2 = tri(4, 8, 12);
const NP = peak(NA, NA2, 0, 12);                          // [6, 0.5]
const NG = Graph({ x: 120, y: 150, w: 600, h: 280, from: 0, to: 12 });

// ---- discrete example
const DX = [1, 2, 3, 4], DA = [0.3, 0.8, 1, 0.5], DA2 = [0.6, 0.4, 0.2, 0.9];
const DMIN = DX.map((_, k) => Math.min(DA[k], DA2[k]));
const DALPHA = Math.max(...DMIN);                         // 0.5

// ---- case 2 (slide 103) with our numbers
const B2 = tri(4, 8, 12), B2f = tri(0, 2, 6), C2 = trap(2, 4, 6, 8);
const P2A = NP, P2B = peak(B2, B2f, 0, 12);               // α_A = 0.5, α_B = 0.25
const ALPHA2 = Math.min(P2A[1], P2B[1]);                  // 0.25
const G2 = [70, 380, 690].map((x, k) => Graph({ x, y: 345, w: 210, h: 140, from: 0, to: k < 2 ? 12 : 10 }));

// ---- case 3 picture (slide 105): two rules, fuzzy inputs
const R3 = {
  A: [bell(6, 1), bell(4.2, 1)], Af: bell(3, 0.8),
  B: [tri(1, 2, 6), tri(3, 4, 8)], Bf: tri(4, 7.5, 8.5),
  C: [bell(6, 1.2), trap(1, 2.5, 5.5, 7)],
};
R3.pA = R3.A.map(f => peak(f, R3.Af, 0, 10));
R3.pB = R3.B.map(f => peak(f, R3.Bf, 0, 10));
R3.al = [0, 1].map(i => Math.min(R3.pA[i][1], R3.pB[i][1]));

// ---- slides 106–107: two rules, crisp inputs x0 and y0
const R6 = {
  A: [bell(4.8, 0.8), trap(1.5, 3, 4.6, 5.9)], B: [bell(5, 0.7), bell(3.4, 0.7)],
  C: [bell(4, 1), bell(6.5, 1.2)], x0: 5.6, y0: 4.4,
};
R6.al = [0, 1].map(i => Math.min(R6.A[i](R6.x0), R6.B[i](R6.y0)));

// Layout of the two-row pictures (slides 105–107).
const ROWS = [90, 240];
const COLS = [60, 320, 660];
const rowGraph = (r, c) => Graph({ x: COLS[c], y: ROWS[r], w: 200, h: 90, from: 0, to: 10 });
const AGG = Graph({ x: 660, y: 420, w: 200, h: 90, from: 0, to: 10 });

async function twoRowAxes(b, p) {
  for (let r = 0; r < 2; r++) {
    await all([0, 1, 2].map(c => rowGraph(r, c).axes(b, `${p}ax${r}${c}`, { yTicks: [], label: 'xyz'[c], size: 16 })));
  }
  await b.box(`${p}bar`, 598, 70, 14, 280, { color: 'soft', r: 3 });
  await b.write(`${p}barl`, 605, 58, 'min', { size: 20, bold: true });
}

// Quiz helpers.
function quizBoard(n, lines) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 52, `سؤال ${n} از 6`, { size: 22, color: 'soft', fa: true });
    for (const [k, l] of lines.entries()) {
      await b.write(`q-${k}`, 500, 108 + k * 50, l.t, { size: l.size || 30, color: l.color || 'ink', fa: !!l.fa });
    }
  };
}

        { t: "max(μ_{A'} ∧ μ_A) = 0.4        max(μ_{B'} ∧ μ_B) = 0.7", size: 28 },
        { t: 'C = (2, 4, 6)', size: 30, color: 'green' },
        { t: "μ_{C'}(5.4) = ?", color: 'orange', size: 36 },
      ]),
      quiz: { answer: ['0.3'], hint: 'اول α = min(0.4,0.7). بعد μ_C(5.4) را از دامنه‌ی پایین‌رونده (6 − z)/2 حساب کن.', explain: 'α = min(0.4,0.7) = 0.4. μ_C(5.4) = (6 − 5.4)/2 = 0.3. پس μ_C′(5.4) = min(0.4,0.3) = 0.3.' },
      solve: async b => {
        const al = Math.min(0.4, 0.7), C = tri(2, 4, 6);
        await b.write('s1', 500, 300, `α = min(0.4, 0.7) = ${fmt(al)}`, { size: 30, color: 'orange' });
        await b.write('s2', 500, 360, `μ_C(5.4) = (6 − 5.4)/2 = ${fmt(C(5.4))}`, { size: 30 });
        await b.write('s3', 500, 430, `μ_{C'}(5.4) = min(${fmt(al)}, ${fmt(C(5.4))}) = ${fmt(Math.min(al, C(5.4)))}`, { size: 34, color: 'green', bold: true });
      },
    },
    {
      say: 'دو قاعده با max-min: α_1 = 0.3 و α_2 = 0.6. در یک نقطه‌ی z_0 داریم μ_C1(z_0) = 0.8 و μ_C2(z_0) = 0.5. مقدار μ_C′(z_0) بعد از ترکیب قاعده‌ها چند است؟',
      draw: quizBoard(4, [
        { t: 'α_1 = 0.3          α_2 = 0.6', size: 30 },
        { t: 'μ_{C1}(z_0) = 0.8          μ_{C2}(z_0) = 0.5', size: 30 },
        { t: "μ_{C'}(z_0) = ?", color: 'orange', size: 36 },
      ]),
      quiz: { answer: ['0.5'], hint: 'هر قاعده: min(α_i, μ_Ci). بعد بین دو قاعده max بگیر.', explain: 'قاعده‌ی 1: min(0.3,0.8) = 0.3. قاعده‌ی 2: min(0.6,0.5) = 0.5. ترکیب: max(0.3,0.5) = 0.5.' },
      solve: async b => {
        const r1 = Math.min(0.3, 0.8), r2 = Math.min(0.6, 0.5);
        await b.write('s1', 500, 300, `قاعده‌ی 1:  ${LTR(`min(0.3, 0.8) = ${fmt(r1)}`)}`, { size: 28, fa: true });
        await b.write('s2', 500, 355, `قاعده‌ی 2:  ${LTR(`min(0.6, 0.5) = ${fmt(r2)}`)}`, { size: 28, fa: true });
        await b.write('s3', 500, 435, `μ_{C'}(z_0) = max(${fmt(r1)}, ${fmt(r2)}) = ${fmt(Math.max(r1, r2))}`, { size: 34, color: 'green', bold: true });
      },
    },
    {
      say: 'اگر ورودی قطعی x_0 باشد، درجه‌ی تطبیق α = max[μ_A′(x) ∧ μ_A(x)] به چه چیزی تبدیل می‌شود؟',
      draw: quizBoard(5, [
        { t: 'ورودی قطعی x0 ؛ α برابر است با:', fa: true, size: 32 },
      ]),
      quiz: {
        choices: ['μ_A(x_0)', 'max μ_A(x) = 1', '1 − μ_A(x_0)'], correct: 0,
        explain: 'ورودی قطعی مثل میله‌ای به ارتفاع 1 در x_0 است؛ اشتراکش با A فقط نقطه‌ی x_0 است، پس α = μ_A(x_0).',
      },
      solve: async b => {
        const g = Graph({ x: 220, y: 200, w: 440, h: 230, from: 0, to: 10 });
        await g.axes(b, 's', { ticks: [6], yTicks: [1] });
        await g.poly(b, 'sA', [[0, 0], [4, 1], [8, 0], [10, 0]], { color: 'blue' });
        await g.poly(b, 'sp', [[6, 0], [6, 1]], { color: 'red', width: 5 });
        await g.guide(b, 'sg', 6, 0.5, { color: 'green' });
        await b.write('e', 820, 330, 'α = μ_A(x_0)', { size: 32, color: 'green', bold: true });
      },
    },
    {
      say: 'آخرین سؤال: در روش Max-Product، خروجی هر قاعده، C_i′، چه شکلی دارد؟',
      draw: quizBoard(6, [
        { t: 'Max-Product composition', size: 34, color: 'blue' },
        { t: 'خروجی هر قاعده چه شکلی دارد؟', fa: true, size: 30 },
      ]),
      quiz: {
        choices: ['C_i در ارتفاع α_i بریده می‌شود و سقف صاف دارد', 'C_i در α_i ضرب می‌شود: همان شکل، با قله‌ای در ارتفاع α_i', 'C_i بدون تغییر می‌ماند'],
        correct: 1,
        explain: 'در Max-Product، μ_Ci′ = α_i · μ_Ci؛ شکل حفظ می‌شود و فقط کوتاه‌تر می‌شود. سقف صاف مال Max-Min است.',
      },
      solve: async b => {
        const g1 = Graph({ x: 560, y: 260, w: 320, h: 180, from: 0, to: 10 });
        const g2 = Graph({ x: 110, y: 260, w: 320, h: 180, from: 0, to: 10 });
        const C = tri(2, 5, 8);
        await all([g1.axes(b, 's1', { yTicks: [1], label: 'z' }), g2.axes(b, 's2', { yTicks: [1], label: 'z' })]);
        await all([g1.curve(b, 'c1', C, { color: 'soft' }), g2.curve(b, 'c2', C, { color: 'soft' })]);
        await shade(b, g1, 'm1', z => Math.min(0.5, C(z)), 2, 8, 'green');
        await shade(b, g2, 'm2', z => 0.5 * C(z), 2, 8, 'blue');
        await b.write('t1', 720, 490, 'Max-Min: سقف صاف', { size: 24, color: 'green', fa: true });
        await b.write('t2', 270, 490, 'Max-Product: همان شکل ✓', { size: 24, color: 'blue', fa: true });
      },
    },
  ],
});
</script>
