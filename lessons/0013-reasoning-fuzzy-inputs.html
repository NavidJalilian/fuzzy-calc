// Lesson 13 — slides 102–107 (part 4: fuzzy reasoning with fuzzy inputs, several rules).
// Explanations are Persian; numbers, math and technical terms stay in English.
//
// The whole lesson grows ONE example — the wind / pressure / rain rules of lessons 12 and 14 —
// one piece per section, and ends every section with a short check question on that example:
//   1. one rule, one antecedent (wind only)        → α = height of A′ ∩ A1 = 0.75
//   2. + pressure: one rule, two antecedents        → α1 = min(0.75, 0.65) = 0.65
//   3. + rule 2: two rules                           → α2 = min(0.6, 0.85) = 0.6, combine with max
//   4. the names: Max-Min and Max-Product composition

const all = list => Promise.all(list);
const fmt = n => String(+n.toFixed(4));

// Membership-function shapes.
const tri = (a, m, c) => v => Math.max(0, Math.min((v - a) / (m - a), (c - v) / (c - m)));
const ramp = (a, c) => v => Math.max(0, Math.min(1, (v - a) / (c - a)));   // 0 before a, rises to 1 at c
const fall = (a, c) => v => Math.max(0, Math.min(1, (c - v) / (c - a)));   // 1 before a, falls to 0 at c
const AND = (f, g) => v => Math.min(f(v), g(v));
const OR = (f, g) => v => Math.max(f(v), g(v));
const K = a => () => a;

// Highest point of min(f, g) on [lo, hi] → [v, μ]. This is max over x of (f ∧ g).
function peak(f, g, lo, hi) {
  const h = v => Math.min(f(v), g(v)), n = 6000, step = (hi - lo) / n;
  let best = lo;
  for (let k = 0; k <= n; k++) { const v = lo + step * k; if (h(v) > h(best) + 1e-12) best = v; }
  let a = Math.max(lo, best - step), c = Math.min(hi, best + step);
  for (let k = 0; k < 80; k++) {
    const m1 = a + (c - a) / 3, m2 = c - (c - a) / 3;
    if (h(m1) < h(m2)) a = m1; else c = m2;
  }
  const v = (a + c) / 2;
  return h(v) >= h(best) ? [v, h(v)] : [best, h(best)];
}

// ---- the sets of lessons 12 and 14 (same lines, same readings 0.6 / 0.2 / 0.3 / 0.7 at x = 8, y = 5)
const A1 = ramp(5, 10);        // «شدید»  strong wind
const A2 = tri(3, 6, 8.5);     // «متوسط» medium wind
const B1 = fall(2.9, 5.9);     // «پایین» low pressure
const B2 = ramp(2.9, 5.9);     // «بالا»  high pressure
const C1 = tri(5, 7, 9);       // «زیاد»  heavy rain
const C2 = tri(2, 4, 6);       // «کم»    light rain
// ---- this lesson's fuzzy readings
const AF = tri(5.5, 8, 11);    // A′ = «حدود 8»
const BF = tri(2, 5, 8);       // B′ = «حدود 5»
const H = {
  A1: peak(A1, AF, 0, 12), B1: peak(B1, BF, 0, 10),   // [8.75, 0.75], [3.95, 0.65]
  A2: peak(A2, AF, 0, 12), B2: peak(B2, BF, 0, 10),   // [7, 0.6],     [5.45, 0.85]
};
const AL1 = Math.min(H.A1[1], H.B1[1]);   // 0.65
const AL2 = Math.min(H.A2[1], H.B2[1]);   // 0.6
const CUT1 = [5 + 2 * AL1, 9 - 2 * AL1];  // 6.3 … 7.7
const CUT2 = [2 + 2 * AL2, 6 - 2 * AL2];  // 3.2 … 4.8
const Z0 = 5.6;                           // the point asked about in sections 3 and 4
const MAXMIN = OR(AND(C1, K(AL1)), AND(C2, K(AL2)));
const MAXPROD = z => Math.max(AL1 * C1(z), AL2 * C2(z));

// ---- discrete version of section 1 (wind only at 6, 7, 8, 9)
const DX = [6, 7, 8, 9], DA = DX.map(A1), DA2 = [0.3, 0.7, 1, 0.7];
const DMIN = DX.map((_, k) => Math.min(DA[k], DA2[k]));
const DALPHA = Math.max(...DMIN);         // 0.7

// A filled region under μ = f(v) between lo and hi.
function shade(b, g, id, f, lo, hi, color = 'green', dur = 700) {
  const pts = [[lo, 0]];
  for (let k = 0; k <= 120; k++) { const v = lo + ((hi - lo) * k) / 120; pts.push([v, f(v)]); }
  pts.push([hi, 0]);
  const d = 'M' + pts.map(([v, m]) => `${g.X(v).toFixed(1)} ${g.Y(m).toFixed(1)}`).join('L') + 'Z';
  return b.path(id, d, { color, fill: color, width: 2.5, dur });
}

// Persian label on the right, formal English line starting at x = 200.
async function row(b, id, y, fa, en, color = 'ink', size = 26) {
  await b.write(`${id}-fa`, 860, y, fa, { size: size - 4, color: 'purple', bold: true, fa: true });
  await b.write(`${id}-en`, 180, y, en, { size, color, anchor: 'start' });
}

// Small orange tag that marks a section check question on the board.
const checkTag = (b, n, x = 905, y = 52) =>
  b.write('chk', x, y, `سؤال بخش ${n}`, { size: 20, color: 'orange', bold: true, fa: true });

// ---- section 1: two big graphs (wind x, rain z)
const GX = Graph({ x: 100, y: 200, w: 360, h: 180, from: 0, to: 12 });
const GZ = Graph({ x: 590, y: 200, w: 300, h: 180, from: 0, to: 10 });

// ---- sections 2–4: one row per rule (x, y, numbers, z) and the combined output
const ROWS = [110, 265];
const PX = r => Graph({ x: 80, y: ROWS[r], w: 180, h: 90, from: 0, to: 12 });
const PY = r => Graph({ x: 320, y: ROWS[r], w: 180, h: 90, from: 0, to: 10 });
const PZ = r => Graph({ x: 690, y: ROWS[r], w: 190, h: 90, from: 0, to: 10 });
const NX = 607;                                    // the numbers column between y and z
const AGG = Graph({ x: 690, y: 425, w: 190, h: 85, from: 0, to: 10 });
const RULE = [
  { A: A1, B: B1, C: C1, a: 'A1', b: 'B1', c: 'C1', hA: H.A1, hB: H.B1, al: AL1, cut: CUT1, aL: 11, bL: 1.2, cL: 7 },
  { A: A2, B: B2, C: C2, a: 'A2', b: 'B2', c: 'C2', hA: H.A2, hB: H.B2, al: AL2, cut: CUT2, aL: 6, bL: 8.8, cL: 4 },
];

async function rowAxes(b, r) {
  const t = { yTicks: [], size: 14 };
  await all([
    PX(r).axes(b, `ax${r}`, { ...t, ticks: [0, 4, 8, 12] }),
    PY(r).axes(b, `ay${r}`, { ...t, ticks: [0, 5, 10], label: 'y' }),
    PZ(r).axes(b, `az${r}`, { ...t, ticks: [0, 5, 10], label: 'z' }),
  ]);
  await b.write(`R${r}`, 44, ROWS[r] + 50, `R${r + 1}`, { size: 20, color: 'purple', bold: true, anchor: 'start' });
}
async function rowCurves(b, r) {
  const R = RULE[r], gx = PX(r), gy = PY(r), gz = PZ(r);
  await all([
    gx.curve(b, `A${r}`, R.A, { color: 'blue', dur: 500 }), gx.curve(b, `Af${r}`, AF, { color: 'red', dur: 500 }),
    gy.curve(b, `B${r}`, R.B, { color: 'blue', dur: 500 }), gy.curve(b, `Bf${r}`, BF, { color: 'red', dur: 500 }),
    gz.curve(b, `C${r}`, R.C, { color: 'soft', dur: 500 }),
  ]);
  await all([
    b.write(`lA${r}`, gx.X(R.aL), gx.Y(1) - 6, R.a, { size: 15, color: 'blue' }),
    b.write(`lAf${r}`, gx.X(8.6), gx.Y(1) - 6, "A'", { size: 15, color: 'red' }),
    b.write(`lB${r}`, gy.X(R.bL), gy.Y(1) - 6, R.b, { size: 15, color: 'blue' }),
    b.write(`lBf${r}`, gy.X(5), gy.Y(1) - 6, "B'", { size: 15, color: 'red' }),
    b.write(`lC${r}`, gz.X(R.cL), gz.Y(1) - 6, R.c, { size: 15, color: 'soft' }),
  ]);
}
// Shade one antecedent overlap, mark its highest point and write the height in the numbers column.
async function rowHeight(b, r, side) {
  const R = RULE[r];
  const [g, f, ff, p, lo, hi, line] = side === 'x'
    ? [PX(r), R.A, AF, R.hA, 0, 12, 0]
    : [PY(r), R.B, BF, R.hB, 0, 10, 1];
  await shade(b, g, `o${side}${r}`, AND(f, ff), lo, hi, 'orange', 500);
  await b.dot(`d${side}${r}`, g.X(p[0]), g.Y(p[1]), { color: 'red', r: 5 });
  await b.write(`n${side}${r}`, NX, ROWS[r] + 18 + line * 28, `${side}: ${fmt(p[1])}`, { size: 18, color: 'orange', bold: true });
}
// α_r = min of the two heights; then cut (min) or scale (prod) C_r.
async function rowAlpha(b, r) {
  await b.write(`na${r}`, NX, ROWS[r] + 80, `α${r + 1} = ${fmt(RULE[r].al)}`, { size: 19, color: 'green', bold: true });
}
async function rowCut(b, r, mode = 'min') {
  const R = RULE[r], gz = PZ(r);
  if (mode === 'min') {
    await gz.poly(b, `cut${r}`, [[0, R.al], [10, R.al]], { color: 'orange', width: 2, dur: 300 });
    await shade(b, gz, `Cc${r}`, AND(R.C, K(R.al)), 0, 10, 'green', 500);
  } else {
    await shade(b, gz, `Cp${r}`, z => R.al * R.C(z), 0, 10, 'blue', 500);
  }
}
// Explanation lines under the rule rows (x 50–640, y 405–530).
async function text(b, lines) {
  await b.erase('t-*', 200);
  for (const [k, l] of lines.entries()) {
    await b.write(`t-${k}`, 345, 410 + k * 38, l.t, { size: l.size || 22, color: l.color || 'ink', fa: !!l.fa, bold: !!l.bold });
  }
}
async function header(b, t) {
  await b.erase('h', 150);
  await b.write('h', 500, 46, t, { size: 26, color: 'orange', bold: true, fa: true });
}

// Final quiz board.
function quizBoard(n, lines) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 52, `سؤال پایانی ${n} از 5`, { size: 22, color: 'soft', fa: true });
    for (const [k, l] of lines.entries()) {
      await b.write(`q-${k}`, 500, 108 + k * 50, l.t, { size: l.size || 30, color: l.color || 'ink', fa: !!l.fa });
    }
  };
}

        await AGG.axes(b, 'agg', { yTicks: [], ticks: [0, 5, 10], label: 'z', size: 14 });
        await b.arrow('down', 785, 380, 785, 402, { color: 'red', head: 8 });
        await b.write('mx', 820, 398, 'max', { size: 18, color: 'red', bold: true });
        await shade(b, AGG, 'U', MAXMIN, 0, 10, 'green');
        await text(b, [
          { t: "μ_{C'}(z) = μ_{C1'}(z) ∨ μ_{C2'}(z)", color: 'green', bold: true, size: 26 },
          { t: 'اسلاید: μC1 نوشته؛ درستش μC1′ است (مجموعه‌ی بریده‌شده)', fa: true, size: 19, color: 'red' },
          { t: 'اسلاید: اندیس i در فرمول α جا افتاده؛ هر قاعده α خودش را دارد', fa: true, size: 19, color: 'red' },
        ]);
      },
    },
    {
      say: 'سؤال بخش 3: خروجی ترکیب‌شده در z = 5.6 چند است؟ یعنی μ_C′(5.6). راهنمایی: هر قاعده را جدا حساب کن، بعد max.',
      draw: async b => {
        await checkTag(b, 3);
        await b.ring('qz', AGG.X(Z0), AGG.Y(0) + 4, 14, 14, { color: 'orange' });
        await text(b, [{ t: "μ_{C'}(5.6) = ?", color: 'orange', bold: true, size: 28 }]);
      },
      quiz: {
        given: ['C1 = مثلث (5, 7, 9) و α1 = 0.65','C2 = مثلث (2, 4, 6) و α2 = 0.6','Max-Min: μCi′(z) = min(αi, μCi(z))','ترکیب: μC′(z) = max(μC1′(z), μC2′(z))'],
        find: 'μC′(5.6)',
        answer: ['0.3'], hint: 'μ_C1(5.6) = (5.6 − 5)/2 و μ_C2(5.6) = (6 − 5.6)/2. هر کدام min با α خودش، بعد max.', explain: 'قاعده‌ی 1: μ_C1(5.6) = 0.3 و min(0.65,0.3) = 0.3. قاعده‌ی 2: μ_C2(5.6) = 0.2 و min(0.6,0.2) = 0.2. ترکیب: max(0.3,0.2) = 0.3.' },
      solve: async b => {
        await AGG.guide(b, 'qg', Z0, MAXMIN(Z0), { color: 'blue' });
        await text(b, [
          { t: `R1:  min(0.65, μ_C1(5.6) = ${fmt(C1(Z0))}) = ${fmt(Math.min(AL1, C1(Z0)))}` },
          { t: `R2:  min(0.6, μ_C2(5.6) = ${fmt(C2(Z0))}) = ${fmt(Math.min(AL2, C2(Z0)))}` },
          { t: `μ_{C'}(5.6) = max(0.3, 0.2) = ${fmt(MAXMIN(Z0))}`, color: 'green', bold: true, size: 26 },
        ]);
      },
    },

    // ================================================================ section 4: the names
    {
      say: 'بخش 4: کاری که کردیم اسم دارد: *Max-Min composition*. min دو جا به کار رفت: برای and بین مقدم‌ها، و برای بریدن C_i در α_i. max هم دو جا: برای ارتفاع اشتراک، و برای ترکیب قاعده‌ها. برای همین «max-min».',
      term: ['Max-Min composition', 'ترکیب max-min'],
      draw: async b => {
        await b.erase(['chk', 'qz', 'qg*']);
        await header(b, 'بخش 4: Max-Min composition');
        await text(b, [
          { t: 'min: بین مقدم‌ها (and) و برای بریدن C در α', fa: true, color: 'green' },
          { t: 'max: ارتفاع اشتراک، و ترکیب قاعده‌ها', fa: true, color: 'red' },
          { t: "μ_{Ci'} = α_i ∧ μ_{Ci}        μ_{C'} = ∨_i μ_{Ci'}", size: 24 },
        ]);
      },
    },
    {
      say: 'اسلاید 106 همین شکل را با ورودی *قطعی* x_0 و y_0 می‌کشد. با ورودی دقیق 8 و 5، ارتفاع‌ها فقط خواندن نمودار می‌شوند: α_1 = min(0.6,0.3) = 0.3 و α_2 = min(0.2,0.7) = 0.2. این دقیقاً مثال درس 14 است. همان روش، فقط α ها کوچک‌ترند چون ورودی دقیق جای انعطاف ندارد.',
      draw: async b => {
        await text(b, [
          { t: 'ورودی فازی (این درس):   α1 = 0.65    α2 = 0.6', fa: true, color: 'green' },
          { t: 'ورودی قطعی 8 و 5 (درس 14):   α1 = min(0.6, 0.3) = 0.3    α2 = min(0.2, 0.7) = 0.2', fa: true, color: 'purple', size: 19 },
          { t: 'روش یکی است؛ فقط α عوض می‌شود', fa: true, size: 20, color: 'soft' },
        ]);
      },
    },
    {
      say: 'و *Max-Product composition* (اسلاید 107): همه چیز مثل قبل است، فقط به جای بریدن، C_i را در α_i *ضرب* می‌کنیم: μ_Ci′ = α_i · μ_Ci. نتیجه همان شکل مثلث است ولی کوتاه‌تر، با قله‌ای در ارتفاع α_i؛ سقف صاف ندارد. ترکیب قاعده‌ها باز با max است.',
      term: ['Max-Product composition', 'ترکیب max-product'],
      draw: async b => {
        await header(b, 'بخش 4: Max-Product composition');
        await b.erase(['Cc*', 'cut*', 'U']);
        await rowCut(b, 0, 'prod');
        await rowCut(b, 1, 'prod');
        await shade(b, AGG, 'Up', MAXPROD, 0, 10, 'blue');
        await text(b, [
          { t: "μ_{Ci'} = α_i · μ_{Ci}", color: 'blue', bold: true, size: 26 },
          { t: 'همان شکل C، کوتاه‌تر؛ قله در ارتفاع α', fa: true, size: 20 },
          { t: 'بریدن = Max-Min      ضرب = Max-Product', fa: true, size: 20, color: 'soft' },
        ]);
      },
    },
    {
      say: 'سؤال بخش 4: با Max-Product، خروجی ترکیب‌شده در همان z = 5.6 چند است؟ همان حساب بخش 3، فقط ضرب به جای min.',
      draw: async b => {
        await checkTag(b, 4);
        await b.ring('qz', AGG.X(Z0), AGG.Y(0) + 4, 14, 14, { color: 'orange' });
        await text(b, [{ t: "Max-Product:   μ_{C'}(5.6) = ?", color: 'orange', bold: true, size: 28 }]);
      },
      quiz: {
        given: ['C1 = مثلث (5, 7, 9) و α1 = 0.65','C2 = مثلث (2, 4, 6) و α2 = 0.6','Max-Product: μCi′(z) = αi × μCi(z)','ترکیب: μC′(z) = max(μC1′(z), μC2′(z))'],
        find: 'μC′(5.6) با Max-Product',
        answer: ['0.195'], hint: 'μ_C1(5.6) = 0.3 و μ_C2(5.6) = 0.2 (از بخش 3). هر کدام ضرب در α خودش، بعد max.', explain: 'قاعده‌ی 1: 0.65 × 0.3 = 0.195. قاعده‌ی 2: 0.6 × 0.2 = 0.12. ترکیب: max(0.195,0.12) = 0.195. با Max-Min جواب 0.3 بود؛ ضرب همیشه کوچک‌تر یا مساوی min است.' },
      solve: async b => {
        await AGG.guide(b, 'qg', Z0, MAXPROD(Z0), { color: 'blue' });
        await text(b, [
          { t: `R1:  0.65 × 0.3 = ${fmt(AL1 * C1(Z0))}` },
          { t: `R2:  0.6 × 0.2 = ${fmt(AL2 * C2(Z0))}` },
          { t: `μ_{C'}(5.6) = max(0.195, 0.12) = ${fmt(MAXPROD(Z0))}`, color: 'green', bold: true, size: 26 },
        ]);
      },
    },

    // ================================================================ summary
    {
      say: 'جمع‌بندی: کل درس یک زنجیره است که روی یک مثال ساختیم. این را یک بار دیگر بخوانید، بعد سراغ سؤال‌های پایانی برویم که عددهایشان تازه است.',
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 60, 'یادت باشد', { size: 44, color: 'orange', bold: true, fa: true });
        const L = [
          'ورودی فازی: ارتفاع اشتراک حقیقت و شرط، یعنی بلندترین min (باد: 0.75)',
          'ورودی قطعی حالت خاص است: α = μA(x0) (درس 12: 0.6)',
          'چند مقدم: ارتفاع هر کدام جدا، بعد min (0.75 و 0.65 → 0.65)',
          'چند قاعده: حقیقت‌ها مشترک، هر قاعده α خودش (0.65 و 0.6)',
          'C هر قاعده: بریدن در α (Max-Min) یا ضرب در α (Max-Product)',
          'ترکیب قاعده‌ها همیشه با max (در 5.6: 0.3 یا 0.195)',
        ];
        for (const [k, l] of L.entries()) await b.write(`m${k}`, 920, 125 + k * 56, '•  ' + l, { size: 23, anchor: 'start', fa: true });
        await b.write('f', 500, 490, "α = max[ μ_{A'}(x) ∧ μ_A(x) ]        μ_{C'}(z) = α ∧ μ_C(z)", { size: 26, color: 'blue' });
      },
    },

    // ================================================================ final quizzes (fresh numbers)
    {
      say: 'سؤال‌های پایانی با عددهای تازه. اول: دو مجموعه‌ی گسسته داریم؛ A شرط قاعده است و A′ حقیقت. درجه‌ی تطبیق α چند است؟',
      draw: quizBoard(1, [
        { t: 'A = 0.2/1 + 0.7/2 + 1/3 + 0.4/4', color: 'blue' },
        { t: "A' = 0.5/1 + 0.3/2 + 0.6/3 + 1/4", color: 'red' },
        { t: "α = max[ μ_{A'} ∧ μ_A ] = ?", color: 'orange', size: 34 },
      ]),
      quiz: { answer: ['0.6'], hint: 'برای هر عنصر min دو درجه را بگیر (اول درجه، بعد عنصر)، بعد بزرگ‌ترینشان را.', explain: 'minها: 0.2، 0.3، 0.6، 0.4. بزرگ‌ترین 0.6 است. تله: 1 در A′ کنار 0.4 در A فقط 0.4 می‌دهد.' },
      solve: async b => {
        const A = [0.2, 0.7, 1, 0.4], A2 = [0.5, 0.3, 0.6, 1];
        const M = A.map((v, k) => Math.min(v, A2[k]));
        for (let k = 0; k < 4; k++) {
          await b.write(`s${k}`, 230 + k * 180, 330, `${k + 1}: min(${fmt(A[k])}, ${fmt(A2[k])})`, { size: 22, dur: 250 });
          await b.write(`r${k}`, 230 + k * 180, 375, fmt(M[k]), { size: 30, color: 'orange', bold: true, dur: 200 });
        }
        await b.ring('rr', 230 + 2 * 180, 365, 30, 24, { color: 'green' });
        await b.write('ans', 500, 460, `α = max(${M.map(fmt).join(', ')}) = ${fmt(Math.max(...M))}`, { size: 34, color: 'green', bold: true });
      },
    },
    {
      say: 'مثلث‌ها: A = (0,4,8) شرط قاعده و A′ = (6,7,8) حقیقت فازی است. ارتفاع اشتراکشان، یعنی α، چند است؟',
      draw: quizBoard(2, [
        { t: "A = (0, 4, 8)          A' = (6, 7, 8)" },
        { t: 'α = ?', color: 'orange', size: 36 },
      ]),
      quiz: { answer: ['0.4'], hint: 'دامنه‌ی پایین‌رونده‌ی A یعنی (8 − x)/4 و دامنه‌ی بالارونده‌ی A′ یعنی (x − 6)/1 را مساوی بگذار.', explain: '(8 − x)/4 = x − 6 پس x = 6.4 و α = (8 − 6.4)/4 = 0.4. شیب‌ها فرق دارند، پس برخورد وسطِ راه نیست.' },
      solve: async b => {
        const g = Graph({ x: 150, y: 230, w: 480, h: 220, from: 0, to: 10 });
        const A = tri(0, 4, 8), A2 = tri(6, 7, 8), p = peak(A, A2, 0, 10);
        await g.axes(b, 's', { ticks: [0, 4, 6, 7, 8], yTicks: [0.5, 1] });
        await all([g.curve(b, 'sA', A, { color: 'blue' }), g.curve(b, 'sA2', A2, { color: 'red' })]);
        await shade(b, g, 'so', AND(A, A2), 6, 8, 'orange');
        await g.guide(b, 'sg', p[0], p[1], { color: 'green' });
        await b.write('e1', 820, 300, '(8 − x)/4 = x − 6', { size: 24 });
        await b.write('e2', 820, 345, `x = ${fmt(p[0])}`, { size: 26 });
        await b.write('e3', 820, 395, `α = ${fmt(p[1])}`, { size: 32, color: 'green', bold: true });
      },
    },
    {
      say: 'یک قاعده با دو مقدم: ارتفاع اشتراک برای x شده 0.4 و برای y شده 0.7. مؤخر C مثلث (2,4,6) است و استلزام min. مقدار μ_C′ در z = 5.4 چند است؟',
      draw: quizBoard(3, [
        { t: "max(μ_{A'} ∧ μ_A) = 0.4        max(μ_{B'} ∧ μ_B) = 0.7", size: 28 },
        { t: 'C = (2, 4, 6)', size: 30, color: 'green' },
        { t: "μ_{C'}(5.4) = ?", color: 'orange', size: 36 },
      ]),
      quiz: { answer: ['0.3'], hint: 'اول α = min(0.4,0.7). بعد μ_C(5.4) را از دامنه‌ی پایین‌رونده (6 − z)/2 حساب کن.', explain: 'α = min(0.4,0.7) = 0.4. μ_C(5.4) = (6 − 5.4)/2 = 0.3. پس μ_C′(5.4) = min(0.4,0.3) = 0.3.' },
      solve: async b => {
        const al = Math.min(0.4, 0.7), C = tri(2, 4, 6);
        await b.write('s1', 500, 300, `α = min(0.4, 0.7) = ${fmt(al)}`, { size: 30, color: 'orange' });
        await b.write('s2', 500, 360, `μ_C(5.4) = (6 − 5.4)/2 = ${fmt(C(5.4))}`, { size: 30 });
        await b.write('s3', 500, 430, `μ_{C'}(5.4) = min(${fmt(al)}, ${fmt(C(5.4))}) = ${fmt(Math.min(al, C(5.4)))}`, { size: 34, color: 'green', bold: true });
      },
    },
    {
      say: 'دو قاعده با max-min: α_1 = 0.3 و α_2 = 0.6. در یک نقطه‌ی z_0 داریم μ_C1(z_0) = 0.8 و μ_C2(z_0) = 0.5. مقدار μ_C′(z_0) بعد از ترکیب قاعده‌ها چند است؟',
      draw: quizBoard(4, [
        { t: 'α_1 = 0.3          α_2 = 0.6', size: 30 },
        { t: 'μ_{C1}(z_0) = 0.8          μ_{C2}(z_0) = 0.5', size: 30 },
        { t: "μ_{C'}(z_0) = ?", color: 'orange', size: 36 },
      ]),
      quiz: { answer: ['0.5'], hint: 'هر قاعده: min(α_i, μ_Ci). بعد بین دو قاعده max بگیر.', explain: 'قاعده‌ی 1: min(0.3,0.8) = 0.3. قاعده‌ی 2: min(0.6,0.5) = 0.5. ترکیب: max(0.3,0.5) = 0.5.' },
      solve: async b => {
        const r1 = Math.min(0.3, 0.8), r2 = Math.min(0.6, 0.5);
        await b.write('s1', 500, 300, `قاعده‌ی 1:  min(0.3, 0.8) = ${fmt(r1)}`, { size: 28, fa: true });
        await b.write('s2', 500, 355, `قاعده‌ی 2:  min(0.6, 0.5) = ${fmt(r2)}`, { size: 28, fa: true });
        await b.write('s3', 500, 435, `μ_{C'}(z_0) = max(${fmt(r1)}, ${fmt(r2)}) = ${fmt(Math.max(r1, r2))}`, { size: 34, color: 'green', bold: true });
      },
    },
    {
      say: 'آخرین سؤال: در روش Max-Product، خروجی هر قاعده، C_i′، چه شکلی دارد؟',
      draw: quizBoard(5, [
        { t: 'Max-Product composition', size: 34, color: 'blue' },
        { t: 'خروجی هر قاعده چه شکلی دارد؟', fa: true, size: 30 },
      ]),
      quiz: {
        choices: ['C_i در ارتفاع α_i بریده می‌شود و سقف صاف دارد', 'C_i در α_i ضرب می‌شود: همان شکل، با قله‌ای در ارتفاع α_i', 'C_i بدون تغییر می‌ماند'],
        correct: 1,
        explain: 'در Max-Product، μ_Ci′ = α_i · μ_Ci؛ شکل حفظ می‌شود و فقط کوتاه‌تر می‌شود. سقف صاف مال Max-Min است.',
      },
      solve: async b => {
        const g1 = Graph({ x: 560, y: 260, w: 320, h: 180, from: 0, to: 10 });
        const g2 = Graph({ x: 110, y: 260, w: 320, h: 180, from: 0, to: 10 });
        const C = tri(2, 5, 8);
        await all([g1.axes(b, 's1', { yTicks: [1], label: 'z' }), g2.axes(b, 's2', { yTicks: [1], label: 'z' })]);
        await all([g1.curve(b, 'c1', C, { color: 'soft' }), g2.curve(b, 'c2', C, { color: 'soft' })]);
        await shade(b, g1, 'm1', z => Math.min(0.5, C(z)), 2, 8, 'green');
        await shade(b, g2, 'm2', z => 0.5 * C(z), 2, 8, 'blue');
        await b.write('t1', 720, 490, 'Max-Min: سقف صاف', { size: 24, color: 'green', fa: true });
        await b.write('t2', 270, 490, 'Max-Product: همان شکل ✓', { size: 24, color: 'blue', fa: true });
      },
    },
  ],
});
</script>
