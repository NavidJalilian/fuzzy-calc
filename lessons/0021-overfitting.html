// Lesson 21 — slides 198–203 (part 6: machine learning). Overfitting, underfitting, generalization,
// decision boundaries.

const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text
const FA = /[؀-ۿ]/;

async function node(b, id, x, y, w, h, label, o = {}) {
  await b.box(id, x, y, w, h, { color: o.color || 'blue', fill: o.fill ?? (o.color || 'blue'), dur: o.dur ?? 350 });
  const size = o.size || 24;
  await b.write(id + '-t', x + w / 2, y + h / 2 + size / 3, label, { size, fa: FA.test(label), color: o.text || 'ink', bold: o.bold, dur: 250 });
}

function quizBoard(n, question, o = { size: 30, fa: true }) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 140, question, o);
  };
}

// ---- the two-class picture of slides 199–203: circles (o) on the left, pluses (+) on the right.
// Coordinates are 0..1 inside the frame (u to the right, v downwards). 19 + 1 circles, 19 + 1 pluses.
const CIRCLES = [[0.144, 0.407], [0.209, 0.653], [0.112, 0.212], [0.192, 0.094], [0.142, 0.618], [0.271, 0.774], [0.175, 0.269], [0.322, 0.624], [0.115, 0.748], [0.144, 0.863], [0.223, 0.49], [0.251, 0.87], [0.186, 0.19], [0.116, 0.528], [0.319, 0.493], [0.056, 0.123], [0.288, 0.189], [0.192, 0.787], [0.052, 0.838]];
const PLUSES = [[0.492, 0.507], [0.453, 0.213], [0.664, 0.917], [0.665, 0.733], [0.591, 0.207], [0.555, 0.932], [0.675, 0.577], [0.757, 0.513], [0.635, 0.325], [0.772, 0.626], [0.725, 0.196], [0.618, 0.404], [0.732, 0.697], [0.734, 0.326], [0.405, 0.085], [0.48, 0.126], [0.529, 0.253], [0.562, 0.541], [0.781, 0.413]];
const ODD_CIRCLE = [0.5, 0.7];   // a circle that landed among the pluses
const ODD_PLUS = [0.34, 0.33];   // a plus that landed among the circles
const NEW_POINT = [0.30, 0.38];  // a new, unseen circle
// Boundaries u = f(v). Circles are on the left (u < f(v)).
const FIT = v => 0.42 - 0.6 * (v - 0.5) ** 2;                                   // smooth: 2 training errors
const OVER = v => FIT(v) - 0.17 * Math.exp(-(((v - 0.355) / 0.06) ** 2)) + 0.19 * Math.exp(-(((v - 0.7) / 0.06) ** 2)) + 0.015 * Math.sin(v * 40); // bends round every point: 0 errors
const UNDER = v => 0.12 + 0.5 * v;                                              // straight line: 4 errors

function frame(x, y, w, h) {
  return { x, y, w, h, X: u => x + 12 + u * (w - 24), Y: v => y + 12 + v * (h - 24) };
}
async function drawData(b, id, F, small = false) {
  const r = small ? 5 : 8, ps = small ? 18 : 28;
  await b.box(`${id}-fr`, F.x, F.y, F.w, F.h, { color: 'ink', r: 2, dur: 300 });
  await all([
    ...[...CIRCLES, ODD_CIRCLE].map(([u, v], k) => b.ring(`${id}-c${k}`, F.X(u), F.Y(v), r, r, { color: 'red', tilt: 0, dur: 80 })),
    ...[...PLUSES, ODD_PLUS].map(([u, v], k) => b.write(`${id}-p${k}`, F.X(u), F.Y(v) + ps * 0.35, '+', { size: ps, color: 'green', bold: true, dur: 80 })),
  ]);
}
function boundary(b, id, F, f, color = 'orange') {
  const pts = [];
  for (let k = 0; k <= 100; k++) { const v = k / 100; pts.push([+F.X(f(v)).toFixed(1), +F.Y(v).toFixed(1)]); }
  return b.wire(id, pts, { color, width: 3, dur: 900 });
}

// ---- the same idea for regression: y grows and levels off; three fits.
const TRUE = x => 1 + 1.6 * x - 0.1 * x * x;
const REG = [0.6, -0.7, 0.8, -0.5, 0.7, -0.8, 0.5, -0.6, 0.4].map((d, k) => [k + 1, +(TRUE(k + 1) + d).toFixed(2)]);
const MEAN = REG.reduce((s, [, y]) => s + y, 0) / REG.length;
