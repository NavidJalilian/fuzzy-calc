// Lesson 5 — slides 51–53 (linguistic hedges) + homework 1, question 2.
// Explanations are Persian; numbers, math and technical terms stay in English.

const fmt = n => String(+(+n).toFixed(3));
const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`;  // keeps a left-to-right run intact inside Persian board text
const RTL = s => `⁧${s}⁩`;  // keeps a Persian quiz choice right-to-left inside its button

// The hedges of slides 52–53, as functions of the membership degree m.
const H = {
  very: m => m ** 2,
  veryvery: m => m ** 3,               // slide 52: pow(A) = μ^3
  notvery: m => 1 - m ** 2,
  somewhat: m => Math.sqrt(m),
  indeed: m => (m <= 0.5 ? 2 * m ** 2 : 1 - 2 * (1 - m) ** 2),
};

// Writes one table row: a label at lx, then one value per column. Cell ids: `${id}-${c}`.
async function row(b, id, lx, xs, y, label, vals, o = {}) {
  const size = o.size || 26;
  await b.write(`${id}-l`, lx, y, label, { size: o.ls || size, color: o.lc || 'purple', dur: 200 });
  for (const [c, v] of vals.entries()) {
    await b.write(`${id}-${c}`, xs[c], y, fmt(v), { size, color: o.colorOf?.(v, c) || o.color || 'ink', dur: o.dur ?? 160 });
  }
}

function quizBoard(n, lines) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 55, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    for (const [k, [t, o]] of lines.entries()) await b.write(`q-${k}`, 500, 115 + k * 52, t, { size: 32, ...o });
  };
}

      say: 'indeed tall: اول حالت را پیدا کن. 0، 0.2 و 0.4 زیر 0.5 هستند، پس 2μ^2: یعنی 0، 0.08 و 0.32. 0.7 و 1 بالای 0.5 هستند: برای 0.7 داریم 1 − 2 × 0.3^2 = 0.82، و برای 1 داریم 1 − 0 = 1.',
      draw: async b => {
        await b.erase('nt*');
        await row(b, 't-in', 165, XT, YT.in, 'indeed', TALL.m.map(H.indeed), { ls: 24, colorOf: (v, c) => (TALL.m[c] <= 0.5 ? 'blue' : 'orange') });
        await b.write('nt', 330, 470, 'μ ≤ 0.5:   2μ^2', { size: 28, color: 'blue' });
        await b.write('nt2', 700, 470, 'μ ≥ 0.5:   1 − 2(1 − μ)^2', { size: 28, color: 'orange' });
        await b.write('nt3', 500, 525, '0.7  →  1 − 2(0.3)^2 = 1 − 0.18 = 0.82', { size: 26, color: 'green' });
      },
    },
    // ---------------------------------------------------------- 16. the curves
    {
      say: 'روی نمودار: tall خط سیاه است. very tall، آبی، زیر آن است و جمع‌تر شده؛ برای اینکه «خیلی بلند» حساب شوی، قد بیشتری لازم است. somewhat tall، سبز، بالای آن است و پهن‌تر. نقطه‌ها را خطی به هم وصل کرده‌ایم.',
      draw: async b => {
        await b.clear();
        await gT.axes(b, 'ax', { ticks: TALL.x, label: 'x' });
        const pts = f => TALL.x.map((x, c) => [x, f(TALL.m[c])]);
        await gT.poly(b, 'p-tall', pts(m => m), { color: 'ink', width: 4 });
        await gT.poly(b, 'p-very', pts(H.very), { color: 'blue' });
        await gT.poly(b, 'p-sw', pts(H.somewhat), { color: 'green' });
        await b.write('lg1', 790, 150, 'somewhat tall', { size: 26, color: 'green', anchor: 'start' });
        await b.write('lg2', 790, 200, 'tall', { size: 26, color: 'ink', anchor: 'start' });
        await b.write('lg3', 790, 250, 'very tall', { size: 26, color: 'blue', anchor: 'start' });
        await gT.guide(b, 'g60', 60, 0.49, { color: 'blue' });
        await b.write('n60', gT.X(60) + 70, gT.Y(0.49) + 30, '0.49', { size: 22, color: 'blue' });
      },
    },
    // ---------------------------------------------------------- 17. not very short and not very tall
    {
      say: 'آخرین چیز اسلاید 53: «نه خیلی کوتاه و نه خیلی بلند». هر تکه یک not very است و علامت ∧ یعنی AND، که از درس 4 می‌دانیم در فازی همان min است. مثلاً اگر μ_tall = 0.7 و μ_short = 0.2: not very tall = 1 − 0.49 = 0.51، not very short = 1 − 0.04 = 0.96، و جواب min(0.51, 0.96) = 0.51.',
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 80, 'نه خیلی کوتاه و نه خیلی بلند', { size: 36, color: 'orange', bold: true, fa: true });
        await b.write('f', 500, 160, '[1 − (μ_tall(x))^2]  ∧  [1 − (μ_short(x))^2]', { size: 32 });
        await b.write('and', 500, 215, '∧ = AND = min', { size: 28, color: 'purple' });
        await b.write('g', 500, 290, 'μ_tall = 0.7        μ_short = 0.2', { size: 30, color: 'blue' });
        await b.write('s1', 300, 360, '1 − 0.49 = 0.51', { size: 30 });
        await b.write('s2', 700, 360, '1 − 0.04 = 0.96', { size: 30 });
        await b.write('s1l', 300, 400, 'not very tall', { size: 22, color: 'soft' });
        await b.write('s2l', 700, 400, 'not very short', { size: 22, color: 'soft' });
        await b.write('ans', 500, 480, 'min(0.51, 0.96) = 0.51', { size: 40, color: 'green', bold: true });
      },
    },
    // ---------------------------------------------------------- 18. summary
    {
      say: 'جمع‌بندی: این فرمول‌ها را حفظ کنید و تله‌ها را یادتان باشد. بعد برویم سراغ سؤال‌ها.',
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 65, 'یادت باشد', { size: 44, color: 'orange', bold: true, fa: true });
        const L = [['not', '1 − μ'], ['very', 'μ^2'], ['very very', 'μ^3'], ['not very', '1 − μ^2'], ['somewhat', 'μ^{0.5}'],
          ['indeed', '2μ^2   |   1 − 2(1 − μ)^2']];
        for (const [k, [n, f]] of L.entries()) {
          await all([b.write(`sn${k}`, 820, 130 + k * 46, n, { size: 26, color: 'orange', bold: true }),
            b.write(`sf${k}`, 480, 130 + k * 46, f, { size: 26 })]);
        }
        await b.write('m1', 500, 440, `indeed: اول ببین درجه از ${LTR('0.5')} کمتر است یا بیشتر`, { size: 22, color: 'soft', fa: true });
        await b.write('m2', 500, 480, `${LTR('not very ≠ (1 − μ)²')}   ·   ${LTR('∧ = min')}`, { size: 22, color: 'soft', fa: true });
        await b.write('m3', 500, 520, `در تمرین 1 جفت‌ها ${LTR('(x, μ)')} هستند: اول عنصر`, { size: 22, color: 'red', fa: true });
      },
    },
    // ---------------------------------------------------------- quizzes
    {
      say: 'نوبت شماست! با این مجموعه، درجه‌ی عنصر 180 در very very tall چقدر است؟ طبق جزوه حساب کنید.',
      draw: quizBoard(1, [[TALL2, { size: 26, color: 'blue' }], ['very very tall  at  x = 180 :  μ = ?', { color: 'orange' }]]),
      quiz: { answer: ['0.512'], hint: 'جفت (180, 0.8) یعنی درجه 0.8 است. very very طبق اسلاید 52 یعنی توان 3.', explain: '0.8^3 = 0.512' },
      solve: async b => {
        await b.write('s1', 500, 300, '(180, 0.8)  →  μ = 0.8', { size: 32, color: 'blue' });
        await b.write('s2', 500, 380, '0.8^3 = 0.8 × 0.8 × 0.8 = 0.512', { size: 36, color: 'green', bold: true });
      },
    },
    {
      say: 'همان مجموعه: درجه‌ی عنصر 180 در indeed tall چقدر است؟',
      draw: quizBoard(2, [[TALL2, { size: 26, color: 'blue' }], ['indeed tall  at  x = 180 :  μ = ?', { color: 'orange' }]]),
      quiz: { answer: ['0.92'], hint: 'درجه 0.8 از 0.5 بیشتر است، پس حالت دوم: 1 − 2(1 − μ)^2.', explain: '1 − 2 × 0.2^2 = 1 − 0.08 = 0.92' },
      solve: async b => {
        await b.write('s1', 500, 290, '0.8 ≥ 0.5  →  1 − 2(1 − μ)^2', { size: 30, color: 'orange' });
        await b.write('s2', 500, 360, '1 − 2(0.2)^2 = 1 − 2 × 0.04 = 1 − 0.08', { size: 30 });
        await b.write('s3', 500, 440, '= 0.92', { size: 44, color: 'green', bold: true });
      },
    },
    {
      say: 'همان مجموعه: درجه‌ی عنصر 160 در somewhat tall تقریباً چقدر است؟',
      draw: quizBoard(3, [[TALL2, { size: 26, color: 'blue' }], ['somewhat tall  at  x = 160 :  μ ≈ ?', { color: 'orange' }]]),
      quiz: {
        choices: ['0.09', '0.3', '0.548', '0.91'], correct: 2,
        explain: 'somewhat یعنی جذر: جذر 0.3 تقریباً 0.548 است. 0.09 جواب very است، نه somewhat.',
      },
      solve: async b => {
        await b.write('s1', 500, 300, '(160, 0.3)  →  μ = 0.3', { size: 32, color: 'blue' });
        await b.write('s2', 500, 380, '(0.3)^{0.5} = √0.3 ≈ 0.548', { size: 38, color: 'green', bold: true });
        await b.write('s3', 500, 450, `${LTR('0.548 > 0.3')}: ${LTR('somewhat')} آسان‌گیرتر است`, { size: 24, color: 'soft', fa: true });
      },
    },
    {
      say: 'سؤال تله‌ای: اگر μ_tall(x) = 0.6 باشد، درجه‌ی not very tall چقدر است؟',
      draw: quizBoard(4, [['μ_tall(x) = 0.6', { color: 'blue' }], ['not very tall :  μ = ?', { color: 'orange' }]]),
      quiz: {
        choices: ['0.16', '0.36', '0.4', '0.64'], correct: 3,
        explain: 'اول very: 0.6^2 = 0.36، بعد مکمل: 1 − 0.36 = 0.64. جواب 0.16 همان (1 − 0.6)^2 است که اشتباه است.',
      },
      solve: async b => {
        await b.write('s1', 500, 290, 'very:   0.6^2 = 0.36', { size: 32 });
        await b.write('s2', 500, 360, 'not very:   1 − 0.36 = 0.64', { size: 38, color: 'green', bold: true });
        await b.write('s3', 500, 440, '(1 − 0.6)^2 = 0.16   ✗', { size: 30, color: 'red' });
        await b.line('s3x', 380, 432, 620, 424, { color: 'red' });
      },
    },
    {
      say: 'اسلاید 53: قد علی طوری است که μ_tall = 0.4 و μ_short = 0.5. درجه‌ی «نه خیلی کوتاه و نه خیلی بلند» چقدر است؟',
      draw: quizBoard(5, [['μ_tall = 0.4        μ_short = 0.5', { color: 'blue' }], ['[1 − (μ_tall)^2]  ∧  [1 − (μ_short)^2] = ?', { color: 'orange', size: 30 }]]),
      quiz: { answer: ['0.75'], hint: 'هر کروشه را جدا حساب کن، بعد ∧ یعنی min.', explain: '1 − 0.16 = 0.84 و 1 − 0.25 = 0.75، پس min(0.84, 0.75) = 0.75' },
      solve: async b => {
        await b.write('s1', 300, 300, '1 − 0.4^2 = 0.84', { size: 30 });
        await b.write('s2', 700, 300, '1 − 0.5^2 = 0.75', { size: 30 });
        await b.write('s3', 500, 390, 'min(0.84, 0.75) = 0.75', { size: 40, color: 'green', bold: true });
      },
    },
    {
      say: 'سؤال آخر: طبق اسلاید 52 جزوه، فرمول very very کدام است؟',
      draw: quizBoard(6, [['very very :  μ_{pow(A)}(x) = ?', { color: 'orange' }]]),
      quiz: {
        choices: ['(μ_A(x))^{0.5}', '(μ_A(x))^2', '(μ_A(x))^3', '(μ_A(x))^4'], correct: 2,
        explain: 'جزوه very very را pow(A) با توان 3 تعریف کرده. توان 4 نسخه‌ی کتاب‌هاست؛ در امتحان فرمول جزوه را بنویسید.',
      },
      solve: async b => {
        await b.write('s1', 500, 260, 'μ_{pow(A)}(x) = (μ_A(x))^3', { size: 40, color: 'green', bold: true });
        await b.write('s2', 500, 340, 'very = μ^2      very very = μ^3', { size: 30 });
        await b.write('s3', 500, 410, `${LTR('μ⁴')} مال کتاب‌هاست، نه جزوه`, { size: 26, color: 'soft', fa: true });
      },
    },
  ],
});
