<script>
// Lesson 2 — slides 19–28 (Part 1: what fuzzy logic is) + homework 1 notation.
// Explanations are Persian; numbers, math and technical terms stay in English.

const fmt = n => String(+n.toFixed(4));
const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run (numbers, math) intact inside Persian board text

// Slide 24: the "tall" set as ordered pairs (height in metres, degree).
const TALL = [[1, 0], [1.3, 0.3], [1.5, 0.5], [1.7, 0.7], [1.75, 0.75], [1.9, 0.9], [2, 1], [2.1, 1], [2.2, 1]];
const TG = () => Graph({ x: 140, y: 230, w: 640, h: 220, from: 1, to: 2.2 });

// Homework 1, question 1: A on X = {1, …, 6} written as μ/x.
const HW_A = [[0.5, 2], [0.7, 3], [1, 4], [0.6, 5], [1, 6]];
const muA = x => (HW_A.find(([, e]) => e === x) || [0])[0];

// Five temperature sets shaped like slide 27 (the lesson's own break points, °C).
const tri = (a, m, c) => x => Math.max(0, Math.min((x - a) / (m - a), (c - x) / (c - m)));
const TEMP = [
  ['cold', 'سرد', 'blue', x => Math.max(0, Math.min(1, (15 - x) / 5)), 5],
  ['cool', 'خنک', 'purple', tri(10, 15, 20), 15],
  ['normal', 'عادی', 'ink', tri(15, 20, 25), 20],
  ['warm', 'گرم', 'orange', tri(20, 25, 30), 25],
  ['hot', 'داغ', 'red', x => Math.max(0, Math.min(1, (x - 25) / 5)), 35],
];
const mu = (name, x) => TEMP.find(t => t[0] === name)[3](x);

// A stacked fraction "degree over element" drawn by hand.
async function frac(b, id, cx, cy, top, bottom, o = {}) {
  await b.write(`${id}-t`, cx, cy - 18, top, { size: o.size || 44, color: o.top || 'orange', bold: true });
  await b.line(`${id}-l`, cx - 45, cy, cx + 45, cy, { color: 'ink', width: 3, dur: 200 });
  await b.write(`${id}-b`, cx, cy + 50, bottom, { size: o.size || 44, color: o.bottom || 'blue', bold: true });
}

function quizBoard(n, question, o = { size: 48 }, sub) {
  return async b => {
    await b.clear();
    await b.write('q-n', 500, 60, `سؤال ${n} از 6`, { size: 24, color: 'soft', fa: true });
    await b.write('q-q', 500, 130, question, o);
    if (sub) await b.write('q-s', 500, 190, sub, { size: 30, color: 'blue' });
  };
}

// Quiz solution for homework set A: read every fraction into a table.
async function solveA(b, focus) {
  const X = [210, 330, 450, 570, 690, 810];
  await b.write('sx', 100, 260, 'x', { size: 34, color: 'purple' });
  await b.write('sm', 100, 340, 'μ_A(x)', { size: 28, color: 'purple' });
  for (let k = 0; k < 6; k++) {
    await b.write(`sx${k}`, X[k], 260, String(k + 1), { size: 34, color: 'blue', dur: 150 });
    await b.write(`sm${k}`, X[k], 340, fmt(muA(k + 1)), { size: 34, color: muA(k + 1) ? 'green' : 'red', bold: true, dur: 150 });
  }
  await b.line('sl', 60, 290, 880, 290, { color: 'soft', width: 2 });
  await b.ring('sr', X[focus - 1], 315, 50, 70, { color: 'orange', tilt: 0 });
}

Teacher.start({
  id: 'L02',

    {
      say: 'اول یک اسم: *universe of discourse* یا مجموعه‌ی جهانی، که با U یا X نشانش می‌دهند، یعنی همه‌ی مقدارهایی که درباره‌شان حرف می‌زنیم. U می‌تواند *گسسته* باشد، یعنی چند مقدار جدا از هم مثل X = {1,2,3,4,5,6} در تمرین 1؛ یا *پیوسته*، یعنی همه‌ی عددهای یک بازه، مثل دمای 0 تا 40.',

        await b.line('l1', 560, 250, 940, 250, { color: 'soft', width: 2 });

    // ---------------------------------------------------------- 3. form 1: ordered pairs
    {
      say: 'شکل 1، *زوج مرتب* (اسلایدهای 19 و 23): هر عنصر را کنار درجه‌اش می‌نویسیم: A = {(x,μ_A(x)) | x ∈ U}. ترتیب مهم است: اول خودِ عنصر x، بعد درجه‌اش. مثلاً (1.5, 0.5) یعنی «عنصر 1.5 با درجه‌ی 0.5».',

        await b.write('fc', 398, 190, ',', { size: 50 });
        await b.write('fm', 485, 190, 'μ_A(x)', { size: 50, color: 'orange', bold: true });
        await b.write('f1', 560, 190, ') | x ∈ U }', { size: 50, anchor: 'start' });
        await b.arrow('a1', 330, 275, 365, 215, { color: 'blue' });
        await b.write('a1l', 310, 310, 'اول: عنصر', { size: 28, color: 'blue', fa: true });
        await b.arrow('a2', 530, 275, 490, 215, { color: 'orange' });

        await b.write('e', 500, 420, '{ (1, 0), (1.5, 0.5), (2, 1) }', { size: 42, color: 'green' });
        await b.write('ef', 500, 480, `${LTR('(1.5, 0.5)')} = عنصر ${LTR('1.5')} با درجه‌ی ${LTR('0.5')}`, { size: 28, color: 'soft', fa: true });

    {

        await b.write('atl', 720, 310, 'درجه', { size: 32, color: 'orange', fa: true });
        await b.arrow('ab', 640, 360, 560, 360, { color: 'blue' });

        await b.write('e', 500, 480, '0.5/1.5 + 1/2', { size: 40, color: 'green' });
      },
    },
    // ---------------------------------------------------------- 5. form 3: ∫ μ/x

      tip: true,
      draw: async b => {
        await b.clear();
        await b.write('h', 500, 80, 'جابه‌جایی: زوج ↔ کسر', { size: 40, color: 'orange', bold: true, fa: true });
        await b.write('p', 250, 230, '( 2 , 0.5 )', { size: 56 });
        await b.write('pl1', 205, 290, 'x', { size: 30, color: 'blue' });
        await b.write('pl2', 290, 290, 'μ', { size: 30, color: 'orange' });
        await b.arrow('ar', 400, 215, 600, 215, { color: 'purple' });
        await b.arrow('al', 600, 245, 400, 245, { color: 'purple' });
        await frac(b, 'fr', 750, 230, '0.5', '2', { size: 52 });
        await b.write('n1', 250, 400, 'زوج: اول افقی، بعد عمودی', { size: 28, color: 'blue', fa: true });
        await b.write('n2', 750, 400, 'کسر: درجه بالا می‌نشیند', { size: 28, color: 'orange', fa: true });
        await b.write('n3', 500, 490, 'هر دو یعنی: عنصر 2 با درجه‌ی 0.5', { size: 30, color: 'green', fa: true });
      },
    },
    // ---------------------------------------------------------- 8. homework 1 set
    {
      say: 'تمرین 1 مجموعه‌ها را این‌طور داده: X = {1,2,3,4,5,6} و A = {0.5/2,0.7/3,1/4,0.6/5,1/6}. این همان شکل 2 است، فقط با ویرگول به جای +. هر کسر را بخوان: بالا درجه، پایین عنصر. ولی عنصر 1 کجاست؟ در X هست ولی در فهرست A نیامده. قانون: *عنصری که نوشته نشده، درجه‌اش 0 است*.',

    },
    // ---------------------------------------------------------- 11. slide graph warning
    {
      say: 'یک نکته درباره‌ی شکل خود اسلاید 24: محور افقی‌اش یک نقطه‌ی 0 هم دارد که در فهرست نیامده، و فاصله‌ها را *مساوی* کشیده؛ یعنی 1 تا 1.3 همان‌قدر جا گرفته که 1.7 تا 1.75. پس شیب ظاهری نمودار اسلاید گمراه‌کننده است. نموداری که اینجا کشیدیم فاصله‌های واقعی دارد. همیشه به *فهرست زوج‌ها* اعتماد کن.',
