// Lesson 8 — slides 73–80 (Part 2: fuzzy operations and inference) and Homework 2.
// Explanations are Persian; numbers, math and technical terms stay in English.
// Every matrix cell, every B′ and every y* below is computed in code, not typed by hand.

const f = v => String(+v.toFixed(4));
const all = list => Promise.all(list);
const LTR = s => `⁦${s}⁩`; // keeps a left-to-right run intact inside Persian board text

const OPS = { min: Math.min, prod: (a, b) => a * b };
const relation = (A, B, op) => A.map(a => B.map(v => OPS[op](a, v)));
const compose = (Ap, R, op) => R[0].map((_, j) => Math.max(...Ap.map((a, i) => OPS[op](a, R[i][j]))));
const wavg = (ys, ms) => {
  const num = ys.reduce((s, y, k) => s + y * ms[k], 0), den = ms.reduce((s, m) => s + m, 0);
  return { num, den, y: num / den };
};

// ------------------------------------------------------------------ slide 74 data (temperature → speed)
const T = [100, 125, 150, 175, 200], TA = [0, 0.5, 1, 0.5, 0];   // Normal temperature (A)
const V = [10, 20, 30, 40, 50], VB = [0, 0.6, 1, 0.6, 0];         // Medium velocity (B)
const AP = [0, 0.5, 0, 0, 0];                                     // A′ for temperature 125 (slide 77)
const SLIDE = { xs: T, as: TA, ys: V, bs: VB, ap: AP };
const MM = { R: relation(TA, VB, 'min'), Bp: compose(AP, relation(TA, VB, 'min'), 'min') };
const MP = { R: relation(TA, VB, 'prod'), Bp: compose(AP, relation(TA, VB, 'prod'), 'prod') };
MM.d = wavg(V, MM.Bp); MP.d = wavg(V, MP.Bp);

// ------------------------------------------------------------------ Homework 2 (rainfall → humidity)
const HX = [20, 40, 60, 80, 100], H = [0.2, 0.4, 0.6, 0.8, 1];
const HY = [25, 50, 75, 100], HN = [0.1, 0.6, 0.8, 1];
const HAP = [0, 0, 0, 0.8, 0];
const HW = { xs: HX, as: H, ys: HY, bs: HN, ap: HAP };
HW.R = relation(H, HN, 'prod'); HW.Bp = compose(HAP, HW.R, 'prod'); HW.d = wavg(HY, HW.Bp);
const HW_MINMAT = compose(HAP, relation(H, HN, 'min'), 'prod');   // matrix with min, composition with ×
const HW_ONE = compose([0, 0, 0, 1, 0], HW.R, 'prod');            // input written as 1

// ------------------------------------------------------------------ the matrix board
// Rows = x points (value, a_i, later a′_i), columns = y points (value, b_j), answer row B′ at the bottom.
function MF(D) {
  const n = D.xs.length, p = D.ys.length, step = p === 5 ? 100 : 120;
  const CX = D.ys.map((_, j) => 340 + j * step);
  const RY = D.xs.map((_, i) => 172 + i * 55);
  return { CX, RY, XV: 105, XA: 185, XP: 262, HY: 88, HB: 120, BY: 462, CY: 525, L: 298, R: CX[p - 1] + 50, top: RY[0] - 36, bot: RY[n - 1] + 18 };
}
function bracket(b, id, x, top, bot, side) {
  const t = side === 'left' ? 12 : -12;
  return b.wire(id, [[x + t, top], [x, top], [x, bot], [x + t, bot]], { color: 'soft', dur: 250 });
}
// op: 'min' | 'prod'. diff: colour the cells where × gives a different number than min.
async function frame(b, D, op, o = {}) {
  const L = MF(D), R = relation(D.as, D.bs, op), Rmin = relation(D.as, D.bs, 'min');
  await all([
    b.write('hx', L.XV, L.HB, 'x', { size: 22, color: 'soft' }),
    b.write('ha', L.XA, L.HB, 'a_i', { size: 22, color: 'purple' }),
    b.write('hy', L.R + 42, L.HY, 'y', { size: 22, color: 'soft' }),
    b.write('hb', L.R + 42, L.HB, 'b_j', { size: 22, color: 'orange' }),
    bracket(b, 'mbl', L.L, L.top, L.bot, 'left'), bracket(b, 'mbr', L.R, L.top, L.bot, 'right'),
  ]);
  await all(D.ys.map((y, j) => all([
    b.write(`yv-${j}`, L.CX[j], L.HY, String(y), { size: 24, dur: 150 }),
    b.write(`yb-${j}`, L.CX[j], L.HB, f(D.bs[j]), { size: 22, color: 'orange', dur: 150 }),
  ])));
  for (const [i, x] of D.xs.entries()) {
    await all([
      b.write(`xv-${i}`, L.XV, L.RY[i], String(x), { size: 24, dur: 150 }),
      b.write(`xa-${i}`, L.XA, L.RY[i], f(D.as[i]), { size: 24, color: 'purple', dur: 150 }),
      ...R[i].map((v, j) => b.write(`r-${i}-${j}`, L.CX[j], L.RY[i], f(v), {
        size: 24, dur: o.slow ? 300 : 150,
        color: o.diff && v !== Rmin[i][j] ? 'orange' : 'ink', bold: o.diff && v !== Rmin[i][j],
      })),
    ]);
  }
  await all([
    b.write('mode', 890, 205, op === 'min' ? 'max-min' : 'max-product', { size: 22, color: op === 'min' ? 'purple' : 'orange', bold: true }),
    b.write('modef', 890, 240, op === 'min' ? 'm = min(a, b)' : 'r = a × b', { size: 20, color: 'soft' }),
  ]);
}
// A′ beside the matrix; rows with a′ = 0 are dimmed (they can only give 0).
async function inputColumn(b, D) {
  const L = MF(D);
  await b.write('hp', L.XP, L.HB, 'a′_i', { size: 22, color: 'orange', bold: true });
  for (const [i, a] of D.ap.entries()) await b.write(`xp-${i}`, L.XP, L.RY[i], f(a), { size: 26, color: 'orange', bold: a > 0, dur: 200 });
  await b.dim(D.ap.flatMap((a, i) => (a > 0 ? [] : [`r-${i}-*`, `xv-${i}`, `xa-${i}`, `xp-${i}`])), 0.25);
  await b.write('bpn', L.XP, L.BY, 'B′ =', { size: 28, bold: true });
  await all(D.ys.map((_, j) => b.write(`bp-${j}`, L.CX[j], L.BY, '?', { size: 26, color: 'soft', dur: 150 })));
}
// Column j of B′ = A′ ∘ R: pair a′_i with r_ij (min or ×), then take the max.
async function column(b, D, op, j) {
  const L = MF(D), R = relation(D.as, D.bs, op);
  const terms = D.ap.map((a, i) => OPS[op](a, R[i][j]));
  const best = Math.max(...terms);
  const show = D.ap.map((a, i) => (op === 'min' ? `min(${f(a)},${f(R[i][j])})` : `${f(a)}×${f(R[i][j])}`));
  await b.box('cb', L.CX[j] - 40, L.top + 2, 80, L.bot - L.top - 4, { color: 'orange', dur: 400 });
  await b.write('calc', 500, L.CY, `b′_${j + 1} = max{${show.join(', ')}} = ${f(best)}`, { size: 20, dur: 500 });
  await b.write(`bp-${j}`, L.CX[j], L.BY, f(best), { size: 26, color: 'green', bold: true, dur: 250 });
}

// ------------------------------------------------------------------ bar graphs
// Bars are drawn as thin boxes from the x axis up to μ.
async function bars(b, g, id, xs, ms, { color = 'blue', w = 16, labels = true, dur = 300 } = {}) {
  for (const [k, x] of xs.entries()) {
    const m = ms[k];
    if (m > 0) await b.box(`${id}-${k}`, g.X(x) - w / 2, g.Y(m), w, g.Y(0) - g.Y(m), { color, r: 3, dur });
    if (labels) await b.write(`${id}v-${k}`, g.X(x), g.Y(m) - 8, f(m), { size: 18, color, dur: 120 });
  }
}
// The crisp answer: an arrow under the axis pointing at y*.
async function ystar(b, g, id, y, o = {}) {
  await b.arrow(`${id}-a`, g.X(y), g.Y(0) + 66, g.X(y), g.Y(0) + 34, { color: 'red', head: 10 });
  await b.write(`${id}-t`, g.X(y), g.Y(0) + 94, `y* = ${f(+y.toFixed(o.digits ?? 4))}`, { size: 24, color: 'red', bold: true });
}

// ------------------------------------------------------------------ quiz data
const QA = [0.2, 0.6, 1, 0.4], QB = [1, 0.6, 0.3, 0.1], QY = [10, 20, 30, 40];
const QAL = QA[1]; // x = 2
const Q1 = QB.map(v => Math.min(QAL, v)), Q1d = wavg(QY, Q1);
const Q3row = QB.map(v => QAL * v), Q3 = Q3row.map(v => QAL * v), Q3d = wavg(QY, Q3);
const Q5y = [2, 4, 6, 8], Q5m = [0.3, 0.6, 0.9, 0.2], Q5d = wavg(Q5y, Q5m);

function quizHead(b, n) {
  return b.write('q-n', 500, 45, `سؤال ${n} از 6`, { size: 22, color: 'soft', fa: true });
}
function quizBoard(n, question, o = { size: 44 }) {
  return async b => {
    await b.clear();
    await quizHead(b, n);
    await b.write('q-q', 500, 130, question, o);
  };
}
const joinNum = (ys, ms, sep = '·') => ys.map((y, k) => `${y}${sep}${f(ms[k])}`).join(' + ');
